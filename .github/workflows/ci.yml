name: CI/CD

on:
  push:
    branches: [main, dev]
    # Release tags publish the semver Docker tags the Helm chart resolves to
    # via appVersion (image tag defaults to Chart.AppVersion).
    tags: ['v*.*.*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# One run per ref. Without this, two pushes a minute apart leave both full
# pipelines running — build, scan, sign and deploy twice — which is pure waste
# and, when both reach the deploy step, two concurrent `helm upgrade`s racing
# on the same release. Release tags are exempt: cancelling a tag build would
# leave the tag pushed with no image behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: docker.io
  IMAGE_NAME: ismoilovdev/purl

# Least privilege by default; jobs opt in to more (id-token for cosign,
# security-events for SARIF upload).
permissions:
  contents: read

jobs:
  # ==========================================
  # Stage 1: Lint
  # ==========================================
  perl-lint:
    name: Perl Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache Perl modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache-perl
        with:
          path: |
            ~/perl5
            ~/.cpanm
          key: perl-${{ runner.os }}-${{ hashFiles('cpanfile') }}
          restore-keys: perl-${{ runner.os }}-

      - name: Install cpanm
        run: curl -L https://cpanmin.us | sudo perl - App::cpanminus

      - name: Install Perl dependencies
        if: steps.cache-perl.outputs.cache-hit != 'true'
        run: |
          cpanm --local-lib ~/perl5 --notest --installdeps .
          cpanm --local-lib ~/perl5 --notest Perl::Critic Test::More File::Temp Test::MockModule

      - name: Check Perl syntax
        run: |
          export PERL5LIB="$HOME/perl5/lib/perl5:lib"
          for f in $(find lib -name '*.pm'); do
            perl -c "$f" || exit 1
          done

      - name: Run Perl::Critic
        run: |
          export PATH="$HOME/perl5/bin:$PATH"
          export PERL5LIB="$HOME/perl5/lib/perl5:lib"
          perlcritic --profile .perlcriticrc lib/

      - name: Run Perl tests
        run: |
          export PERL5LIB="$HOME/perl5/lib/perl5:lib"
          prove -r t/

  js-lint:
    name: JavaScript Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  k8s-validate:
    name: K8s Validate (Helm ${{ matrix.helm }})
    runs-on: ubuntu-latest
    env:
      # purl.autoGenerateSecrets is false by default: the chart refuses to
      # invent PURL_CLICKHOUSE_PASSWORD / PURL_SESSION_SECRET / PURL_API_KEYS
      # because a clusterless render mints a fresh one every time, so every
      # Argo CD sync would rotate the ClickHouse password and break auth
      # (issue #22). A real `helm install` has cluster access and writes the
      # value once; this flag is what makes a clusterless render equivalent to
      # that first install. Renders that use purl.existingSecret omit it.
      #
      # It is also passed to the guard assertions BELOW, deliberately: without
      # it those renders would fail on the missing-secret guard instead of the
      # guard under test, and every one of them would have been passing for the
      # wrong reason.
      HELM_AUTOGEN: --set purl.autoGenerateSecrets=true
    strategy:
      fail-fast: false
      matrix:
        # BOTH majors, deliberately. Helm 3 and Helm 4 disagree about what a
        # clusterless `lookup` returns — 3 gives an empty map, 4 gives nil —
        # and Go template `and` evaluates every argument, so
        # `and $s (index $s.data "K")` renders fine on 4 and dies on 3 with
        # "index of untyped nil". That shipped and only surfaced because CI
        # happened to fall back to Helm 3.9.0. Most public installs use Helm 3,
        # so rendering only under 4 hides the failure from exactly the people
        # who hit it.
        helm: ['v3.16.4', 'v4.2.3']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The action is SHA-pinned but `version` was not, so it installed
      # whatever Helm was newest that morning — and when it could not reach
      # the GitHub API it silently fell back to v3.9.0. An unpinned renderer
      # gating every chart change is not a gate.
      - name: Install Helm
        uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78 # v4
        with:
          version: ${{ matrix.helm }}

      - name: Helm Lint
        run: helm lint chart/ $HELM_AUTOGEN

      # Every render below is a shape a real install can take. `make helm-lint`
      # runs the same set locally.
      - name: Helm Template (default values — the public `helm install` path)
        run: helm template purl chart/ $HELM_AUTOGEN > /dev/null

      - name: Helm Template (dev values)
        run: helm template purl chart/ $HELM_AUTOGEN -f chart/values-dev.yaml > /dev/null

      - name: Helm Template (multi-replica + autoscaling + PDB)
        run: |
          helm template purl chart/ $HELM_AUTOGEN \
            --set autoscaling.enabled=true \
            --set podDisruptionBudget.enabled=true \
            --set networkPolicy.enabled=true \
            --set vector.enabled=true \
            --set 'config.volume.accessModes[0]=ReadWriteMany' \
            --set purl.redis.enabled=true \
            --set purl.redis.url=redis://redis:6379 \
            > /dev/null

      - name: Helm Template (NetworkPolicy with real peers)
        run: |
          helm template purl chart/ $HELM_AUTOGEN \
            --set networkPolicy.enabled=true \
            --set 'networkPolicy.ingress.fromNamespaces[0]=ingress-nginx' \
            --set 'networkPolicy.ingress.fromCIDRs[0]=10.0.0.0/8' \
            --set 'networkPolicy.clickhouse.ingress.fromCIDRs[0]=10.0.0.0/8' \
            --set metrics.serviceMonitor.enabled=true \
            --set metrics.prometheusNamespace=monitoring \
            > /dev/null

      - name: Helm Template (backup CronJob + ClickHouse cluster)
        run: |
          helm template purl chart/ $HELM_AUTOGEN \
            --set backup.enabled=true \
            --set backup.s3.bucket=example-bucket \
            --set backup.s3.existingSecret=example-secret \
            --set clickhouse.cluster.enabled=true \
            --set networkPolicy.enabled=true \
            > /dev/null

      - name: Helm Template (operator-managed Secret, external ClickHouse)
        run: |
          helm template purl chart/ \
            --set purl.existingSecret=my-purl-secret \
            --set clickhouse.enabled=false \
            --set clickhouse.host=clickhouse.example.com \
            > /dev/null

      - name: Helm Template (operator-managed Secret, built-in ClickHouse)
        run: |
          helm template purl chart/ \
            --set purl.existingSecret=my-purl-secret \
            --set purl.existingSecretHasClickHousePassword=true \
            > /dev/null

      # Rendering successfully is NOT evidence the chart is correct. These
      # assert on the rendered content, which is where the last round of
      # silent misconfigurations lived: a policy that rendered fine and
      # dropped replication traffic, a guard that rendered fine and allowed a
      # passwordless database. Each check maps to a fixed, verified bug.
      - name: Assert rendered manifests (security + correctness invariants)
        run: |
          set -euo pipefail

          echo "--- ReplicatedMergeTree fetches parts over interserver 9009."
          echo "--- Without it replicas register, entries propagate, every"
          echo "--- fetch is dropped and replication_queue grows unbounded."
          NP=$(helm template purl chart/ $HELM_AUTOGEN \
                 --set clickhouse.cluster.enabled=true \
                 --set networkPolicy.enabled=true \
               | awk '/kind: NetworkPolicy/,0')
          COUNT=$(printf '%s\n' "$NP" | grep -c 'port: 9009' || true)
          echo "9009 rules found: ${COUNT} (expect 2: ingress + egress)"
          test "$COUNT" -eq 2

          echo "--- PURL_CLICKHOUSE_PASSWORD must never be optional: a missing"
          echo "--- key has to be CreateContainerConfigError, not an empty"
          echo "--- password on a database still reachable from ::/0."
          # backup.enabled defaults to false, so the earlier version of this
          # assertion never rendered the backup CronJob and could not see the
          # `optional: true` that survived there. An assertion cannot protect
          # a configuration it does not render. Enable every workload that
          # consumes this key.
          # Rendered into a variable first, on its own line: inside `if
          # <pipeline>; then` a render FAILURE is indistinguishable from "no
          # match" and the check reports PASSED.
          RENDER=$(helm template purl chart/ \
                     --set purl.existingSecret=my-purl-secret \
                     --set purl.existingSecretHasClickHousePassword=true \
                     --set backup.enabled=true \
                     --set backup.s3.bucket=b \
                     --set backup.s3.existingSecret=aws)
          KINDS=$(printf '%s\n' "$RENDER" | grep -cE '^kind: (Deployment|StatefulSet|CronJob)$' || true)
          echo "workloads rendered: ${KINDS} (expect >= 3: Deployment, StatefulSet, CronJob)"
          test "$KINDS" -ge 3
          OPT=$(printf '%s\n' "$RENDER" \
                | grep -A3 'key: PURL_CLICKHOUSE_PASSWORD' | grep -cE '^[[:space:]]*optional:' || true)
          echo "optional markers on PURL_CLICKHOUSE_PASSWORD keyRefs: ${OPT} (expect 0)"
          test "$OPT" -eq 0

          echo "--- users.d fragment must sort after the image entrypoint's"
          echo "--- default-user.xml or restrictDefaultUser silently does nothing."
          helm template purl chart/ $HELM_AUTOGEN | grep -q 'users.d/zz-purl-users.xml'

          echo "--- ServiceMonitor must not reopen the allow-list cluster-wide."
          helm template purl chart/ $HELM_AUTOGEN \
            --set networkPolicy.enabled=true \
            --set metrics.serviceMonitor.enabled=true \
            --set metrics.prometheusNamespace=monitoring \
            | grep -q 'kubernetes.io/metadata.name: "monitoring"'

          echo "--- Config PVC must outlive helm uninstall."
          helm template purl chart/ $HELM_AUTOGEN | grep -q '"helm.sh/resource-policy": keep'

          echo "All rendered-content assertions passed."

      # issue #22: the chart used to generate the ClickHouse password, session
      # secret and API key from a `lookup` that is ALWAYS empty without cluster
      # access. Under Argo CD that meant a new credential on every sync, and
      # because deployment.yaml and clickhouse-statefulset.yaml carry
      # checksum/secret annotations, a rolling restart of both workloads with
      # it. Dev never noticed because values-secrets.yaml pins the password.
      - name: Assert generated secrets cannot drift under GitOps (issue 22)
        run: |
          set -euo pipefail
          PIN="--set clickhouse.password=pw --set purl.sessionSecret=ss --set purl.apiKeys=ak"

          echo "--- A clusterless render with nothing pinned must REFUSE."
          if err=$(helm template purl chart/ 2>&1 >/dev/null); then
            echo "::error::default render succeeded; it must refuse to invent credentials"
            exit 1
          fi
          printf '%s\n' "$err" | grep -q 'refusing to generate' || {
            echo "::error::render failed, but not on the #22 guard"
            printf '%s\n' "$err" | head -5
            exit 1
          }

          echo "--- Each of the three credentials must be guarded on its own."
          for other in \
            "--set purl.sessionSecret=ss --set purl.apiKeys=ak" \
            "--set clickhouse.password=pw --set purl.apiKeys=ak" \
            "--set clickhouse.password=pw --set purl.sessionSecret=ss" ; do
            if helm template purl chart/ $other > /dev/null 2>&1; then
              echo "::error::one credential may still be left to generate: $other"
              exit 1
            fi
          done

          echo "--- The GitOps-safe path (everything pinned) must be byte-stable."
          # Rendered into variables on their own lines: a render FAILURE inside
          # a pipeline is indistinguishable from "no match" and would report
          # PASSED. And the greps below exist so the equality check cannot be
          # vacuous — two empty renders are equal too.
          A=$(helm template purl chart/ $PIN)
          B=$(helm template purl chart/ $PIN)
          printf '%s\n' "$A" | grep -q 'PURL_CLICKHOUSE_PASSWORD: "pw"'
          printf '%s\n' "$A" | grep -q 'PURL_SESSION_SECRET: "ss"'
          printf '%s\n' "$A" | grep -q 'PURL_API_KEYS: "ak"'
          test "$A" = "$B"

          echo "--- The opt-in escape hatch must still produce a real password."
          GEN=$(helm template purl chart/ $HELM_AUTOGEN \
                | grep -c 'PURL_CLICKHOUSE_PASSWORD: "[A-Za-z0-9]\{32\}"' || true)
          echo "generated 32-char ClickHouse passwords: ${GEN} (expect 1)"
          test "$GEN" -eq 1

          echo "Issue 22 assertions passed."

      # A guard that does not fire is not a guard. Each of these MUST fail to
      # render; a chart change that quietly removes one is caught here.
      - name: Assert render-time guards fire
        run: |
          set -euo pipefail
          assert_fails() {
            desc="$1"; shift
            if err=$(helm template purl chart/ $HELM_AUTOGEN "$@" 2>&1 >/dev/null); then
              echo "::error::guard did NOT fire: ${desc}"
              exit 1
            fi
            # A guard that fires for the wrong reason asserts nothing. If
            # $HELM_AUTOGEN ever goes missing here, every case below starts
            # failing on the issue #22 secret guard and still reports "ok".
            if printf '%s\n' "$err" | grep -q 'refusing to generate'; then
              echo "::error::guard '${desc}' hit the #22 secret guard, not its own"
              exit 1
            fi
            echo "ok (correctly rejected): ${desc}"
          }

          assert_fails "existingSecret + built-in ClickHouse without acknowledgement" \
            --set purl.existingSecret=my-purl-secret

          assert_fails "serviceMonitor + networkPolicy without a Prometheus namespace" \
            --set networkPolicy.enabled=true \
            --set metrics.serviceMonitor.enabled=true

          # The 1.x key must not be silently ignored: a value set that used to
          # work has to say so, not render a policy Prometheus cannot pass.
          assert_fails "the 1.x metrics.serviceMonitor.namespace key" \
            --set networkPolicy.enabled=true \
            --set metrics.serviceMonitor.enabled=true \
            --set metrics.serviceMonitor.namespace=monitoring

          assert_fails "Vector disk buffer below Vector's hard minimum" \
            --set vector.buffer.maxSizeBytes=1024

          assert_fails "multi-replica on a ReadWriteOnce config volume" \
            --set replicaCount=3

      # Pinned version + checksum. `releases/latest/download` silently changes
      # what it serves, and the tarball was previously executed unverified.
      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          set -euo pipefail
          wget -q "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform-linux-amd64.tar.gz" | sha256sum -c -
          tar xzf kubeconform-linux-amd64.tar.gz

      - name: Validate Helm output against K8s schemas
        run: |
          set -euo pipefail
          helm template purl chart/ $HELM_AUTOGEN \
            --set podDisruptionBudget.enabled=true \
            --set networkPolicy.enabled=true \
            --set vector.enabled=true \
            --set backup.enabled=true \
            --set backup.s3.bucket=example-bucket \
            --set backup.s3.existingSecret=example-secret \
            | ./kubeconform -strict -summary -kubernetes-version 1.29.0
          helm template purl chart/ $HELM_AUTOGEN \
            --set autoscaling.enabled=true \
            --set 'config.volume.accessModes[0]=ReadWriteMany' \
            | ./kubeconform -strict -summary -kubernetes-version 1.29.0

  # ==========================================
  # Stage 1c: Release tag guard
  # ==========================================
  # The chart resolves the image tag from Chart.yaml appVersion
  # (image.tag defaults to ""), so a git tag that does not match appVersion
  # publishes a Docker tag the chart never pulls — and leaves the chart
  # pointing at an image that does not exist (ImagePullBackOff for every
  # public `helm install`). Block the mismatch before anything is published.
  # The job itself always runs (a skipped job would skip build-and-push with
  # it, since a skipped `needs` dependency propagates); the checks are
  # step-level and only fire on tag pushes.
  release-guard:
    name: Release Tag Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          # merge-base needs real history, not a depth-1 checkout.
          fetch-depth: 0

      - name: Tag must match chart appVersion
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' chart/Chart.yaml)"
          echo "git tag      : ${GITHUB_REF_NAME} (version ${TAG_VERSION})"
          echo "chart appVer : ${APP_VERSION}"
          if [ "${TAG_VERSION}" != "${APP_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match chart/Chart.yaml appVersion ${APP_VERSION}."
            echo "::error::Bump appVersion (and chart version) in the same commit you tag."
            exit 1
          fi

      # The message above tells you to bump the chart version too, so enforce
      # it. Publishing an unchanged chart version is rejected by
      # `make chart-publish` at the very end of a release, after the Docker
      # tags are already public — this catches it before anything ships.
      - name: Chart version must be bumped since the previous release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          # ^{commit} dereferences an annotated tag to the commit it points at.
          # GITHUB_SHA is the tag OBJECT for an annotated tag, not the commit.
          TAG_COMMIT="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          CHART_VERSION="$(awk '$1 == "version:" {gsub(/"/, "", $2); print $2}' chart/Chart.yaml)"
          PREV_TAG="$(git describe --tags --abbrev=0 --match 'v*.*.*' "${TAG_COMMIT}^" 2>/dev/null || true)"
          if [ -z "${PREV_TAG}" ]; then
            echo "No previous release tag — nothing to compare. chart version ${CHART_VERSION}."
            exit 0
          fi
          # chart/ did not exist at every past tag (it does not exist at
          # v1.2.0). `git show <tag>:chart/Chart.yaml` exits 128 there, and
          # under `set -euo pipefail` that aborted the whole step — the guard
          # meant to protect the release was blocking it, taking
          # build-and-push (needs: release-guard) down with it. Tolerate the
          # missing path, and treat "no previous chart" as nothing to compare.
          PREV_CHART_YAML="$(git show "${PREV_TAG}:chart/Chart.yaml" 2>/dev/null || true)"
          PREV_CHART_VERSION="$(printf '%s\n' "${PREV_CHART_YAML}" \
            | awk '$1 == "version:" {gsub(/"/, "", $2); print $2}')"
          if [ -z "${PREV_CHART_VERSION}" ]; then
            echo "chart/Chart.yaml has no version at ${PREV_TAG} (the chart did not"
            echo "exist yet, or the file is unreadable there) — nothing to compare."
            echo "this tag: ${GITHUB_REF_NAME} (chart version ${CHART_VERSION})."
            exit 0
          fi
          echo "previous tag  : ${PREV_TAG} (chart version ${PREV_CHART_VERSION})"
          echo "this tag      : ${GITHUB_REF_NAME} (chart version ${CHART_VERSION})"
          if [ "${CHART_VERSION}" = "${PREV_CHART_VERSION}" ]; then
            echo "::error::chart/Chart.yaml version is still ${CHART_VERSION}, unchanged since ${PREV_TAG}."
            echo "::error::Bump it — charts.purlogs.com will refuse to republish the same version."
            exit 1
          fi

      - name: Tag must be reachable from main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          # GITHUB_SHA is the ANNOTATED TAG OBJECT's sha for `git tag -a`, not
          # the commit it points at, so `merge-base --is-ancestor` on it was
          # comparing the wrong object. ^{commit} dereferences to the commit.
          TAG_COMMIT="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          echo "tag ${GITHUB_REF_NAME} -> commit ${TAG_COMMIT}"
          if ! git merge-base --is-ancestor "${TAG_COMMIT}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} (${TAG_COMMIT}) is not an ancestor of main. Releases are cut from main."
            exit 1
          fi

  # ==========================================
  # Stage 1b: Security — source & dependency scan
  # ==========================================
  security-fs:
    name: Security Scan (filesystem)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Blocking gate: dependency vulns (web/package-lock.json, cpanfile)
      # and hardcoded secrets. Suppressions live in /.trivyignore.
      - name: Trivy filesystem scan (vuln + secret) — fails on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
          format: table

      # Blocking gate: IaC misconfig findings (Dockerfile, chart/, deploy/).
      # This was pinned to exit-code '0' as "informational for now, the infra
      # work is in flight" — the only check in the release deliberately
      # disabled. The infra work is done, the findings were triaged, and the
      # gate is blocking. Suppressions live in /.trivyignore.yaml, which is
      # PATH-SCOPED (a bare `id:` would disable the rule repo-wide) and
      # carries a reason + owner + expiry per entry.
      - name: Trivy config scan (IaC misconfig) — fails on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          format: table

      # SARIF upload requires GitHub code scanning (free on public repos,
      # needs GitHub Advanced Security on private ones). Non-fatal if the
      # feature is disabled, so it never blocks the pipeline.
      - name: Trivy filesystem scan (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          trivyignores: .trivyignore
          format: sarif
          output: trivy-fs.sarif

      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ==========================================
  # Stage 2: Build and Push (main and dev)
  # ==========================================
  build-and-push:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: [perl-lint, js-lint, k8s-validate, security-fs, release-guard]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      # Required for cosign keyless signing (Sigstore OIDC token).
      id-token: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}

      - name: Determine Docker tag
        id: docker-tag
        run: |
          set -euo pipefail
          # Only main publishes :latest — that is what every `install.sh` and
          # docker-compose pulls. Tags are not branch-constrained in git, so
          # `git tag v9.9.9` on dev would otherwise republish production
          # :latest from unmerged code.
          #
          # Release tags get NO moving tag at all. The catch-all `*)` branch
          # used to map them to `dev`, so cutting v1.3.0 republished
          # ismoilovdev/purl:dev — and values-dev.yaml sets
          # imagePullPolicy: Always, so the dev cluster silently adopted the
          # release image on its next pod restart. Tags get their semver tags
          # from docker/metadata-action below, which is all the chart's
          # appVersion resolution needs.
          case "$GITHUB_REF" in
            refs/heads/main) MOVING=latest ;;
            refs/heads/dev)  MOVING=dev ;;
            *)               MOVING="" ;;
          esac
          echo "ref=$GITHUB_REF -> moving tag='${MOVING:-<none, semver only>}'"
          echo "tag=${MOVING}" >> "$GITHUB_OUTPUT"
          # Non-empty label for artifact names, which cannot be blank.
          echo "slug=${MOVING:-$GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # semver tags only materialise on refs/tags/v* pushes; the Helm chart
          # needs them because image.tag defaults to Chart.AppVersion.
          tags: |
            type=raw,value=${{ steps.docker-tag.outputs.tag }},enable=${{ steps.docker-tag.outputs.tag != '' }}
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Build locally FIRST and scan before anything reaches Docker Hub.
      # The push step below re-uses the same buildx/gha cache, so it is a
      # cache hit and does not rebuild.
      - name: Build image locally (no push)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: false
          load: true
          tags: purl:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # scanners: vuln (no secret scanner) — deliberate.
      # The image bundles third-party CPAN libraries whose POD examples and
      # test fixtures contain sample keys (Crypt::PK::{RSA,ECC,
      # DSA,Ed25519}, Mojo::IOLoop's built-in test server.key). Those are
      # upstream docs/test data, not our secrets, and we cannot remove them.
      # OUR OWN secrets are still gated: the security-fs job scans the repo
      # with scanners: vuln,secret and fails the build on any finding.
      - name: Trivy image scan (vuln) — fails on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: purl:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
          format: table

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Supply chain: SBOM + signature ----
      # Keyless (OIDC) — no secrets required. Signature + attestation are
      # pushed to Docker Hub alongside the image digest.
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: purl-sbom-${{ steps.docker-tag.outputs.slug }}.spdx.json
          upload-artifact: true

      - name: Sign image (cosign keyless)
        env:
          COSIGN_YES: 'true'
          IMAGE_DIGEST: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}
        run: cosign sign --yes "$IMAGE_DIGEST"

      - name: Attest SBOM to image (cosign keyless)
        env:
          COSIGN_YES: 'true'
          IMAGE_DIGEST: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "$IMAGE_DIGEST"

      # Verify what we just published (proves the signature is retrievable).
      - name: Verify signature
        env:
          IMAGE_DIGEST: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE_DIGEST"

  # ==========================================
  # Stage 3: Deploy to dev Kubernetes cluster
  # ==========================================
  # dev push -> Helm deploy to the dev k8s cluster (master-01, namespace
  # purl-dev). The chart is synced from the repo so chart changes deploy
  # too. Secrets (API keys, ClickHouse password, session secret) live on
  # master-01 in /opt/purl-dev/values-secrets.yaml — never in the repo.
  # The legacy demo server (37.27.187.72) is no longer auto-deployed;
  # update it manually if needed.
  deploy-dev:
    name: Deploy Dev (k8s)
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # A dead cluster is not a failed build. When the control plane is
      # unreachable — as it was for days after the nodes lost their private
      # NIC — every push went red at `helm upgrade` while lint, tests, scans
      # and the image build had all passed. A pipeline that is red for reasons
      # the commit cannot fix teaches people to stop reading it, and the next
      # genuine failure gets waved through.
      #
      # So: probe first. Unreachable => warn loudly, skip the deploy, leave the
      # job green. Reachable => every step below runs and a real deploy failure
      # still fails the build, which is the signal we actually want to keep.
      - name: Check cluster reachability
        id: cluster
        continue-on-error: true
        run: |
          if timeout 25 bash -c '</dev/tcp/5.189.148.112/6443' 2>/dev/null; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Dev deploy skipped::Kubernetes API at 5.189.148.112:6443 is unreachable. The image was built and pushed; only the deploy was skipped. See issue #42."
          fi

      # Remove the previous chart copy so deleted templates don't linger.
      - name: Clean previous chart copy on master-01
        if: steps.cluster.outputs.reachable == 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: 5.189.148.112
          username: root
          key: ${{ secrets.K8S_DEV_SSH_KEY }}
          script: rm -rf /opt/purl-dev/chart && mkdir -p /opt/purl-dev

      - name: Copy Helm chart to master-01
        if: steps.cluster.outputs.reachable == 'true'
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: 5.189.148.112
          username: root
          key: ${{ secrets.K8S_DEV_SSH_KEY }}
          source: chart
          target: /opt/purl-dev/

      - name: Helm upgrade purl-dev
        if: steps.cluster.outputs.reachable == 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: 5.189.148.112
          username: root
          key: ${{ secrets.K8S_DEV_SSH_KEY }}
          script: |
            set -e
            # deployedAt annotation forces a pod template change so the
            # mutable :dev tag is re-pulled (imagePullPolicy: Always).
            helm upgrade --install purl /opt/purl-dev/chart \
              --namespace purl-dev \
              -f /opt/purl-dev/chart/values-dev.yaml \
              -f /opt/purl-dev/values-secrets.yaml \
              --set-string podAnnotations.deployedAt="$(date +%s)" \
              --wait --timeout 10m --atomic --cleanup-on-fail
            kubectl -n purl-dev rollout status deployment/purl --timeout=5m
            # /api/health/ready includes the ClickHouse check. Fall back to
            # the legacy /api/health so a rollback to an image predating the
            # split probes still verifies rather than false-failing.
            curl -sf http://localhost:30300/api/health/ready \
              || curl -sf http://localhost:30300/api/health \
              || { echo "Health check failed"; exit 1; }

  # ==========================================
  # Stage 4: Build test (for PRs)
  # ==========================================
  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    needs: [perl-lint, js-lint, k8s-validate, security-fs, release-guard]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build Docker image
        run: docker build -t purl:test .

      # Same gate as the push path, so a PR that introduces a vulnerable
      # base image or package is blocked before it can be merged+pushed.
      # scanners: vuln for the same reason as build-and-push — see the
      # comment there. Repo secrets are covered by the security-fs job.
      - name: Trivy image scan (vuln) — fails on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: purl:test
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
          format: table

      # SBOM for the PR image — uploaded as a build artifact for review.
      # Not signed (nothing is published from a PR).
      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: purl:test
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: purl-sbom-pr-${{ github.event.pull_request.number }}.spdx.json
          upload-artifact: true
