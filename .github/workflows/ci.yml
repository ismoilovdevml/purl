name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: ismoilovdev/purl

jobs:
  # ==========================================
  # Stage 1: Lint
  # ==========================================
  perl-lint:
    name: Perl Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Perl modules
        uses: actions/cache@v4
        id: cache-perl
        with:
          path: |
            ~/perl5
            ~/.cpanm
          key: perl-${{ runner.os }}-${{ hashFiles('cpanfile') }}
          restore-keys: perl-${{ runner.os }}-

      - name: Install cpanm
        run: curl -L https://cpanmin.us | sudo perl - App::cpanminus

      - name: Install Perl dependencies
        if: steps.cache-perl.outputs.cache-hit != 'true'
        run: |
          cpanm --local-lib ~/perl5 --notest --installdeps .
          cpanm --local-lib ~/perl5 --notest Perl::Critic Test::More File::Temp Test::MockModule

      - name: Check Perl syntax
        run: |
          export PERL5LIB="$HOME/perl5/lib/perl5:lib"
          for f in $(find lib -name '*.pm'); do
            perl -c "$f" || exit 1
          done

      - name: Run Perl::Critic
        run: |
          export PATH="$HOME/perl5/bin:$PATH"
          export PERL5LIB="$HOME/perl5/lib/perl5:lib"
          perlcritic --profile .perlcriticrc lib/

      - name: Run Perl tests
        run: |
          export PERL5LIB="$HOME/perl5/lib/perl5:lib"
          prove -r t/

  js-lint:
    name: JavaScript Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ==========================================
  # Stage 2: Build and Push (main and dev)
  # ==========================================
  build-and-push:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: [perl-lint, js-lint]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}

      - name: Determine Docker tag
        id: docker-tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=dev" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.docker-tag.outputs.tag }}
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # Stage 3: Security Scan (Trivy)
  # ==========================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}

      - name: Determine Docker tag
        id: docker-tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=dev" >> $GITHUB_OUTPUT
          fi

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ismoilovdev/purl:${{ steps.docker-tag.outputs.tag }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Scan filesystem for secrets
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ==========================================
  # Stage 4: Build test (for PRs)
  # ==========================================
  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    needs: [perl-lint, js-lint]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t purl:test .
