name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: ismoilovdev/purl

jobs:
  # ==========================================
  # Stage 1: Lint
  # ==========================================
  perl-lint:
    name: Perl Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cpanm and dependencies
        run: |
          curl -L https://cpanmin.us | sudo perl - App::cpanminus
          sudo cpanm --notest --installdeps .
          sudo cpanm --notest Perl::Critic

      - name: Check Perl syntax
        run: |
          for f in $(find lib -name '*.pm'); do
            PERL5LIB=lib perl -c $f || exit 1
          done

      - name: Run Perl::Critic
        run: perlcritic --profile .perlcriticrc lib/

      - name: Install Test::More
        run: sudo cpanm --notest Test::More File::Temp

      - name: Run Perl tests
        run: PERL5LIB=lib prove -r t/

  js-lint:
    name: JavaScript Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ==========================================
  # Stage 2: Build and Push (main and dev)
  # ==========================================
  build-and-push:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: [perl-lint, js-lint]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}

      - name: Determine Docker tag
        id: docker-tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=dev" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.docker-tag.outputs.tag }}
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # Stage 3: Build test (for PRs)
  # ==========================================
  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    needs: [perl-lint, js-lint]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t purl:test .
