name: CI/CD

on:
  push:
    branches: [main, dev]
    # Release tags publish the semver Docker tags the Helm chart resolves to
    # via appVersion (image tag defaults to Chart.AppVersion).
    tags: ['v*.*.*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: ismoilovdev/purl

# Least privilege by default; jobs opt in to more (id-token for cosign,
# security-events for SARIF upload).
permissions:
  contents: read

jobs:
  # ==========================================
  # Stage 1: Lint
  # ==========================================
  perl-lint:
    name: Perl Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache Perl modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache-perl
        with:
          path: |
            ~/perl5
            ~/.cpanm
          key: perl-${{ runner.os }}-${{ hashFiles('cpanfile') }}
          restore-keys: perl-${{ runner.os }}-

      - name: Install cpanm
        run: curl -L https://cpanmin.us | sudo perl - App::cpanminus

      - name: Install Perl dependencies
        if: steps.cache-perl.outputs.cache-hit != 'true'
        run: |
          cpanm --local-lib ~/perl5 --notest --installdeps .
          cpanm --local-lib ~/perl5 --notest Perl::Critic Test::More File::Temp Test::MockModule

      - name: Check Perl syntax
        run: |
          export PERL5LIB="$HOME/perl5/lib/perl5:lib"
          for f in $(find lib -name '*.pm'); do
            perl -c "$f" || exit 1
          done

      - name: Run Perl::Critic
        run: |
          export PATH="$HOME/perl5/bin:$PATH"
          export PERL5LIB="$HOME/perl5/lib/perl5:lib"
          perlcritic --profile .perlcriticrc lib/

      - name: Run Perl tests
        run: |
          export PERL5LIB="$HOME/perl5/lib/perl5:lib"
          prove -r t/

  js-lint:
    name: JavaScript Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  k8s-validate:
    name: K8s Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Helm
        uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78 # v4

      - name: Helm Lint
        run: helm lint chart/

      # Every render below is a shape a real install can take. `make helm-lint`
      # runs the same set locally.
      - name: Helm Template (default values — the public `helm install` path)
        run: helm template purl chart/ > /dev/null

      - name: Helm Template (dev values)
        run: helm template purl chart/ -f chart/values-dev.yaml > /dev/null

      - name: Helm Template (multi-replica + autoscaling + PDB)
        run: |
          helm template purl chart/ \
            --set autoscaling.enabled=true \
            --set podDisruptionBudget.enabled=true \
            --set networkPolicy.enabled=true \
            --set vector.enabled=true \
            --set 'config.volume.accessModes[0]=ReadWriteMany' \
            > /dev/null

      - name: Helm Template (NetworkPolicy with real peers)
        run: |
          helm template purl chart/ \
            --set networkPolicy.enabled=true \
            --set 'networkPolicy.ingress.fromNamespaces[0]=ingress-nginx' \
            --set 'networkPolicy.ingress.fromCIDRs[0]=10.0.0.0/8' \
            --set metrics.serviceMonitor.enabled=true \
            > /dev/null

      - name: Helm Template (backup CronJob + ClickHouse cluster)
        run: |
          helm template purl chart/ \
            --set backup.enabled=true \
            --set backup.s3.bucket=example-bucket \
            --set backup.s3.existingSecret=example-secret \
            --set clickhouse.cluster.enabled=true \
            --set networkPolicy.enabled=true \
            > /dev/null

      - name: Helm Template (operator-managed Secret)
        run: helm template purl chart/ --set purl.existingSecret=my-purl-secret > /dev/null

      # Pinned version + checksum. `releases/latest/download` silently changes
      # what it serves, and the tarball was previously executed unverified.
      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          set -euo pipefail
          wget -q "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform-linux-amd64.tar.gz" | sha256sum -c -
          tar xzf kubeconform-linux-amd64.tar.gz

      - name: Validate Helm output against K8s schemas
        run: |
          set -euo pipefail
          helm template purl chart/ \
            --set podDisruptionBudget.enabled=true \
            --set networkPolicy.enabled=true \
            --set vector.enabled=true \
            --set backup.enabled=true \
            --set backup.s3.bucket=example-bucket \
            --set backup.s3.existingSecret=example-secret \
            | ./kubeconform -strict -summary -kubernetes-version 1.29.0
          helm template purl chart/ \
            --set autoscaling.enabled=true \
            --set 'config.volume.accessModes[0]=ReadWriteMany' \
            | ./kubeconform -strict -summary -kubernetes-version 1.29.0

  # ==========================================
  # Stage 1c: Release tag guard
  # ==========================================
  # The chart resolves the image tag from Chart.yaml appVersion
  # (image.tag defaults to ""), so a git tag that does not match appVersion
  # publishes a Docker tag the chart never pulls — and leaves the chart
  # pointing at an image that does not exist (ImagePullBackOff for every
  # public `helm install`). Block the mismatch before anything is published.
  # The job itself always runs (a skipped job would skip build-and-push with
  # it, since a skipped `needs` dependency propagates); the checks are
  # step-level and only fire on tag pushes.
  release-guard:
    name: Release Tag Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          # merge-base needs real history, not a depth-1 checkout.
          fetch-depth: 0

      - name: Tag must match chart appVersion
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' chart/Chart.yaml)"
          echo "git tag      : ${GITHUB_REF_NAME} (version ${TAG_VERSION})"
          echo "chart appVer : ${APP_VERSION}"
          if [ "${TAG_VERSION}" != "${APP_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match chart/Chart.yaml appVersion ${APP_VERSION}."
            echo "::error::Bump appVersion (and chart version) in the same commit you tag."
            exit 1
          fi

      - name: Tag must be reachable from main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not an ancestor of main. Releases are cut from main."
            exit 1
          fi

  # ==========================================
  # Stage 1b: Security — source & dependency scan
  # ==========================================
  security-fs:
    name: Security Scan (filesystem)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Blocking gate: dependency vulns (web/package-lock.json, cpanfile)
      # and hardcoded secrets. Suppressions live in /.trivyignore.
      - name: Trivy filesystem scan (vuln + secret) — fails on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
          format: table

      # Non-blocking: IaC misconfig findings (Dockerfile, chart/, deploy/).
      # Informational only for now — flipping exit-code to '1' here would
      # gate on files owned by the infra/chart work in flight.
      - name: Trivy config scan (IaC misconfig) — informational
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '0'
          trivyignores: .trivyignore
          format: table

      # SARIF upload requires GitHub code scanning (free on public repos,
      # needs GitHub Advanced Security on private ones). Non-fatal if the
      # feature is disabled, so it never blocks the pipeline.
      - name: Trivy filesystem scan (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          trivyignores: .trivyignore
          format: sarif
          output: trivy-fs.sarif

      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ==========================================
  # Stage 2: Build and Push (main and dev)
  # ==========================================
  build-and-push:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: [perl-lint, js-lint, k8s-validate, security-fs, release-guard]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      # Required for cosign keyless signing (Sigstore OIDC token).
      id-token: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}

      - name: Determine Docker tag
        id: docker-tag
        run: |
          # Only main publishes :latest — that is what every `install.sh` and
          # docker-compose pulls. Tags are not branch-constrained in git, so
          # `git tag v9.9.9` on dev would otherwise republish production
          # :latest from unmerged code. Tags still get their semver tags below
          # via docker/metadata-action, which is all appVersion needs.
          case "${{ github.ref }}" in
            refs/heads/main) echo "tag=latest" >> $GITHUB_OUTPUT ;;
            *)               echo "tag=dev"    >> $GITHUB_OUTPUT ;;
          esac

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # semver tags only materialise on refs/tags/v* pushes; the Helm chart
          # needs them because image.tag defaults to Chart.AppVersion.
          tags: |
            type=raw,value=${{ steps.docker-tag.outputs.tag }}
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Build locally FIRST and scan before anything reaches Docker Hub.
      # The push step below re-uses the same buildx/gha cache, so it is a
      # cache hit and does not rebuild.
      - name: Build image locally (no push)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: false
          load: true
          tags: purl:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # scanners: vuln (no secret scanner) — deliberate.
      # The image bundles third-party CPAN libraries whose POD examples and
      # test fixtures contain sample keys (Crypt::JWT, Crypt::PK::{RSA,ECC,
      # DSA,Ed25519}, Mojo::IOLoop's built-in test server.key). Those are
      # upstream docs/test data, not our secrets, and we cannot remove them.
      # OUR OWN secrets are still gated: the security-fs job scans the repo
      # with scanners: vuln,secret and fails the build on any finding.
      - name: Trivy image scan (vuln) — fails on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: purl:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
          format: table

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Supply chain: SBOM + signature ----
      # Keyless (OIDC) — no secrets required. Signature + attestation are
      # pushed to Docker Hub alongside the image digest.
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: purl-sbom-${{ steps.docker-tag.outputs.tag }}.spdx.json
          upload-artifact: true

      - name: Sign image (cosign keyless)
        env:
          COSIGN_YES: 'true'
          IMAGE_DIGEST: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}
        run: cosign sign --yes "$IMAGE_DIGEST"

      - name: Attest SBOM to image (cosign keyless)
        env:
          COSIGN_YES: 'true'
          IMAGE_DIGEST: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "$IMAGE_DIGEST"

      # Verify what we just published (proves the signature is retrievable).
      - name: Verify signature
        env:
          IMAGE_DIGEST: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE_DIGEST"

  # ==========================================
  # Stage 3: Deploy to dev Kubernetes cluster
  # ==========================================
  # dev push -> Helm deploy to the dev k8s cluster (master-01, namespace
  # purl-dev). The chart is synced from the repo so chart changes deploy
  # too. Secrets (API keys, ClickHouse password, session secret) live on
  # master-01 in /opt/purl-dev/values-secrets.yaml — never in the repo.
  # The legacy demo server (37.27.187.72) is no longer auto-deployed;
  # update it manually if needed (see CLAUDE.md "Server Update").
  deploy-dev:
    name: Deploy Dev (k8s)
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Remove the previous chart copy so deleted templates don't linger.
      - name: Clean previous chart copy on master-01
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: 5.189.148.112
          username: root
          key: ${{ secrets.K8S_DEV_SSH_KEY }}
          script: rm -rf /opt/purl-dev/chart && mkdir -p /opt/purl-dev

      - name: Copy Helm chart to master-01
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: 5.189.148.112
          username: root
          key: ${{ secrets.K8S_DEV_SSH_KEY }}
          source: chart
          target: /opt/purl-dev/

      - name: Helm upgrade purl-dev
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: 5.189.148.112
          username: root
          key: ${{ secrets.K8S_DEV_SSH_KEY }}
          script: |
            set -e
            # Optional: Enterprise/Pro license values (purl.license.*), kept out
            # of values-secrets.yaml so it can be rotated on its own.
            LICENSE_VALUES=""
            [ -f /opt/purl-dev/values-license.yaml ] && LICENSE_VALUES="-f /opt/purl-dev/values-license.yaml"
            # deployedAt annotation forces a pod template change so the
            # mutable :dev tag is re-pulled (imagePullPolicy: Always).
            helm upgrade --install purl /opt/purl-dev/chart \
              --namespace purl-dev \
              -f /opt/purl-dev/chart/values-dev.yaml \
              -f /opt/purl-dev/values-secrets.yaml \
              $LICENSE_VALUES \
              --set-string podAnnotations.deployedAt="$(date +%s)" \
              --wait --timeout 10m --atomic --cleanup-on-fail
            kubectl -n purl-dev rollout status deployment/purl --timeout=5m
            # /api/health/ready includes the ClickHouse check. Fall back to
            # the legacy /api/health so a rollback to an image predating the
            # split probes still verifies rather than false-failing.
            curl -sf http://localhost:30300/api/health/ready \
              || curl -sf http://localhost:30300/api/health \
              || { echo "Health check failed"; exit 1; }

  # ==========================================
  # Stage 4: Build test (for PRs)
  # ==========================================
  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    needs: [perl-lint, js-lint, k8s-validate, security-fs, release-guard]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build Docker image
        run: docker build -t purl:test .

      # Same gate as the push path, so a PR that introduces a vulnerable
      # base image or package is blocked before it can be merged+pushed.
      # scanners: vuln for the same reason as build-and-push — see the
      # comment there. Repo secrets are covered by the security-fs job.
      - name: Trivy image scan (vuln) — fails on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: purl:test
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
          format: table

      # SBOM for the PR image — uploaded as a build artifact for review.
      # Not signed (nothing is published from a PR).
      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: purl:test
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: purl-sbom-pr-${{ github.event.pull_request.number }}.spdx.json
          upload-artifact: true
