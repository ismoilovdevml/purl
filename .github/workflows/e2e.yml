name: E2E Tests

on:
  workflow_dispatch:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Weekly: Sunday at 3am UTC
    - cron: '0 3 * * 0'

env:
  REGISTRY: docker.io
  IMAGE_NAME: ismoilovdev/purl

permissions:
  contents: read

# A PR that gets several pushes should not queue several full E2E runs.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ==========================================
  # Job 1: Browser E2E (Playwright)
  #
  # This job did not exist. The word "playwright" appeared nowhere under
  # .github/, so the nine spec files in web/e2e/ were never executed by
  # anything — which is how the suite came to point at a demo server that has
  # been offline for weeks without a single red build.
  # ==========================================
  playwright:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      # Built explicitly rather than inside the webServer hook so that a build
      # failure is reported as a build failure, not as a Playwright timeout.
      - name: Build the Purl image under test
        run: docker build -t ismoilovdev/purl:e2e-local .

      # playwright.config.js boots web/e2e/stack/up.sh (docker compose) and
      # tears it down in globalTeardown. No external environment is involved.
      - name: Run Playwright tests
        working-directory: web
        run: npx playwright test --reporter=line

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7

  # ==========================================
  # Job 2: Docker Compose E2E
  # ==========================================
  docker-compose-e2e:
    name: Docker Compose E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Docker Compose E2E test
        run: ./tests/e2e/docker-compose-test.sh

  # ==========================================
  # Job 3: Kubernetes E2E (Kind cluster)
  # ==========================================
  k8s-e2e:
    name: K8s E2E (Kind)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Kind
        run: |
          [ "$(uname -m)" = x86_64 ] && curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.25.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      # Same pin as the k8s-validate job in ci.yml — the smoke test installs
      # the chart for real, so it must not drift onto a different Helm than
      # the one that gated it.
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v4
        with:
          version: v4.2.3

      - name: Run K8s E2E smoke test
        run: ./tests/e2e/k8s-smoke.sh
