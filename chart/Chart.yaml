apiVersion: v2
name: purl
description: Lightweight self-hosted log aggregation system
type: application
version: 1.1.0
# Must track the app version that is actually published to Docker Hub:
# image.tag defaults to "" and falls back to appVersion, so bumping this ahead
# of a released tag makes every public `helm install` ImagePullBackOff.
