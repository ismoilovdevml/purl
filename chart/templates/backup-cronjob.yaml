{{- if .Values.backup.enabled }}
{{- if not .Values.backup.s3.bucket }}
{{- fail "backup.enabled=true requires backup.s3.bucket" }}
{{- end }}
{{- if not .Values.backup.s3.existingSecret }}
{{- fail "backup.enabled=true requires backup.s3.existingSecret (holding AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY)" }}
{{- end }}
{{- $archiveConfig := and .Values.backup.includeConfig .Values.config.volume.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "purl.fullname" . }}-backup
  labels:
    {{- include "purl.backup.labels" . | nindent 4 }}
data:
  run-backup.sh: |
    #!/usr/bin/env bash
    # Purl scheduled backup — native ClickHouse BACKUP DATABASE -> S3.
    # Streams server-side; nothing is materialised in this pod.
    set -euo pipefail

    log() { echo "[$(date -u '+%Y-%m-%d %H:%M:%S')] $*"; }

    : "${CH_HOST:?}" "${CH_PORT:?}" "${CH_USER:?}" "${CH_DB:?}"
    : "${S3_BUCKET:?}"

    ch() { clickhouse-client --host "${CH_HOST}" --port "${CH_PORT}" \
             --user "${CH_USER}" --password "${CH_PASSWORD:-}" "$@"; }

    NAME="purl_backup_$(date -u +%Y%m%d_%H%M%S)"
    PREFIX="${S3_PREFIX#/}"; [ -n "${PREFIX}" ] && PREFIX="${PREFIX%/}/"
    if [ -n "${S3_ENDPOINT:-}" ]; then
      BASE="${S3_ENDPOINT%/}/${S3_BUCKET}"
    else
      BASE="https://${S3_BUCKET}.s3.${S3_REGION}.amazonaws.com"
    fi
    URL="${BASE}/${PREFIX}${NAME}"
    {{- if $archiveConfig }}

    # ---------------------------------------------------------------
    # /app/config -> <db>.purl_config_archive
    #
    # A ClickHouse-only backup restores every log line and still leaves you
    # locked out of the dashboard: the user database and settings.json live
    # on the config volume, not in ClickHouse. Park a
    # tarball in a ClickHouse table so the single BACKUP DATABASE below
    # carries it to S3 too.
    # ---------------------------------------------------------------
    log "Archiving /purl-config into ${CH_DB}.purl_config_archive"
    tar czf /tmp/purl-config.tar.gz -C /purl-config .
    ch --query "CREATE TABLE IF NOT EXISTS ${CH_DB}.purl_config_archive (
                  captured_at DateTime DEFAULT now(),
                  archive String
                ) ENGINE = MergeTree
                  ORDER BY captured_at
                  TTL captured_at + INTERVAL ${RETENTION_DAYS:-30} DAY"
    ch --query "INSERT INTO ${CH_DB}.purl_config_archive (archive) FORMAT RawBLOB" \
       < /tmp/purl-config.tar.gz
    rm -f /tmp/purl-config.tar.gz
    log "Config archived"
    {{- else if .Values.backup.includeConfig }}

    # backup.includeConfig is on but config.volume.enabled is off: there is
    # no persistent /app/config to archive (it is an ephemeral emptyDir), so
    # dashboard users and settings are NOT covered by this backup.
    {{- end }}

    log "Backing up DATABASE ${CH_DB} -> S3 (${URL})"
    {{- if .Values.backup.s3.credentialsInQuery }}
    # backup.s3.credentialsInQuery=true — the key and secret are literal
    # arguments of this statement and WILL be recorded verbatim in
    # system.query_log. Turn it off unless an old ClickHouse forces it.
    OUT="$(ch --query "BACKUP DATABASE ${CH_DB} TO S3('${URL}', '${AWS_ACCESS_KEY_ID:?}', '${AWS_SECRET_ACCESS_KEY:?}')")"
    {{- else }}
    # Credentials are resolved server-side from config.d/backup-s3.xml, so
    # the statement — and therefore system.query_log — holds only the URL.
    OUT="$(ch --query "BACKUP DATABASE ${CH_DB} TO S3('${URL}')")"
    {{- end }}
    # The raw server reply is deliberately NOT echoed: in credentialsInQuery
    # mode it can carry the S3 key, and Vector ships this pod's stdout
    # straight back into Purl — which is how a backup key ends up searchable
    # in the log dashboard.
    echo "${OUT}" | grep -q "BACKUP_CREATED" || { echo "ERROR: BACKUP not confirmed" >&2; exit 1; }
    log "Backup created: ${NAME}"
    log "Retention ${RETENTION_DAYS:-30}d: enforce via S3 lifecycle policy on prefix '${S3_PREFIX:-}'."
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "purl.fullname" . }}-backup
  labels:
    {{- include "purl.backup.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: {{ .Values.backup.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.backup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.backup.failedJobsHistoryLimit }}
  jobTemplate:
    metadata:
      labels:
        {{- include "purl.backup.selectorLabels" . | nindent 8 }}
    spec:
      backoffLimit: {{ .Values.backup.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.backup.activeDeadlineSeconds }}
      template:
        metadata:
          {{- /*
            Labels are deliberately NOT purl.selectorLabels. These pods used
            to carry them, so every backup run counted as a Purl pod for the
            PodDisruptionBudget and was caught by the Purl NetworkPolicy —
            whose egress does not allow ClickHouse's native port 9000, the
            one clickhouse-client actually uses.
          */}}
          labels:
            {{- include "purl.backup.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: {{ .Values.backup.restartPolicy }}
          serviceAccountName: {{ include "purl.serviceAccountName" . }}
          {{- with .Values.backup.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backup.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backup.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.backup.affinity }}
          affinity:
            {{- toYaml .Values.backup.affinity | nindent 12 }}
          {{- else if $archiveConfig }}
          affinity:
            podAffinity:
              # The config PVC is ReadWriteOnce: only pods on the node that
              # already has it attached can mount it. Without this the
              # CronJob pod can land elsewhere and stay Pending forever.
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      {{- include "purl.selectorLabels" . | nindent 22 }}
                  topologyKey: kubernetes.io/hostname
          {{- end }}
          containers:
            - name: backup
              image: "{{ .Values.backup.image.repository }}:{{ .Values.backup.image.tag }}"
              imagePullPolicy: {{ .Values.backup.image.pullPolicy }}
              {{- with .Values.backup.securityContext }}
              securityContext:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              command: ["/bin/bash", "/scripts/run-backup.sh"]
              env:
                # clickhouse-client wants a writable HOME and the root
                # filesystem is read-only.
                - name: HOME
                  value: /tmp
                - name: CH_HOST
                  value: {{ include "purl.clickhouse.host" . | quote }}
                - name: CH_PORT
                  value: "9000"
                - name: CH_USER
                  value: {{ .Values.clickhouse.user | quote }}
                {{- /*
                  This keyRef is NOT optional, deliberately, and the CI
                  assertion renders the CronJob with backup.enabled=true to
                  keep it that way. Marked optional, a Secret missing the key
                  started the job with an empty CH_PASSWORD: every scheduled
                  backup then failed authentication silently, the CronJob
                  stayed Active, nothing warned, and the gap was only
                  discovered at restore time. Without it the pod is a loud
                  CreateContainerConfigError instead.
                */}}
                - name: CH_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "purl.secretName" . }}
                      key: PURL_CLICKHOUSE_PASSWORD
                - name: CH_DB
                  value: {{ .Values.clickhouse.database | quote }}
                - name: S3_BUCKET
                  value: {{ .Values.backup.s3.bucket | quote }}
                - name: S3_REGION
                  value: {{ .Values.backup.s3.region | quote }}
                - name: S3_PREFIX
                  value: {{ .Values.backup.s3.prefix | quote }}
                - name: S3_ENDPOINT
                  value: {{ .Values.backup.s3.endpoint | quote }}
                - name: RETENTION_DAYS
                  value: {{ .Values.backup.retentionDays | quote }}
                {{- if .Values.backup.s3.credentialsInQuery }}
                # Needed only in the discouraged in-query credentials mode.
                # Otherwise ClickHouse holds the credentials and this pod
                # never sees them.
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.s3.existingSecret }}
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.s3.existingSecret }}
                      key: AWS_SECRET_ACCESS_KEY
                {{- end }}
              {{- with .Values.backup.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                {{- if $archiveConfig }}
                - name: purl-config
                  mountPath: /purl-config
                  readOnly: true
                {{- end }}
          volumes:
            - name: scripts
              configMap:
                name: {{ include "purl.fullname" . }}-backup
                defaultMode: 0555
            - name: tmp
              emptyDir: {}
            {{- if $archiveConfig }}
            - name: purl-config
              persistentVolumeClaim:
                claimName: {{ include "purl.fullname" . }}-config
                readOnly: true
            {{- end }}
{{- end }}
