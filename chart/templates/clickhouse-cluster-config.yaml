{{- if and .Values.clickhouse.enabled .Values.clickhouse.cluster.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "purl.clickhouse.fullname" . }}-cluster
  labels:
    {{- include "purl.clickhouse.labels" . | nindent 4 }}
data:
  cluster.xml: |
    <clickhouse>
      <remote_servers>
        <{{ .Values.clickhouse.cluster.name }}>
          <shard>
            {{- range $i := until (int .Values.clickhouse.cluster.replicas) }}
            <replica>
              <host>{{ include "purl.clickhouse.fullname" $ }}-{{ $i }}.{{ include "purl.clickhouse.fullname" $ }}-headless</host>
              <port>9000</port>
            </replica>
            {{- end }}
          </shard>
        </{{ .Values.clickhouse.cluster.name }}>
      </remote_servers>

      <macros>
        <cluster>{{ .Values.clickhouse.cluster.name }}</cluster>
        <shard>01</shard>
        <replica from_env="HOSTNAME"/>
      </macros>

      {{- if .Values.clickhouse.cluster.keeper.enabled }}
      <keeper_server>
        <tcp_port>{{ .Values.clickhouse.cluster.keeper.port }}</tcp_port>
        <!-- server_id is supplied by config.d/keeper-id.xml, written per-pod
             by the set-keeper-id init container. It must be the 1-based
             ordinal so it matches the <raft_configuration> ids below; it
             used to come from the 0-based pod-index label via from_env,
             which meant no node ever matched its own raft entry. -->
        <log_storage_path>/var/lib/clickhouse/coordination/log</log_storage_path>
        <snapshot_storage_path>/var/lib/clickhouse/coordination/snapshots</snapshot_storage_path>
        <coordination_settings>
          <operation_timeout_ms>10000</operation_timeout_ms>
          <session_timeout_ms>30000</session_timeout_ms>
          <raft_logs_level>warning</raft_logs_level>
        </coordination_settings>
        <raft_configuration>
          {{- range $i := until (int .Values.clickhouse.cluster.replicas) }}
          <server>
            <id>{{ add $i 1 }}</id>
            <hostname>{{ include "purl.clickhouse.fullname" $ }}-{{ $i }}.{{ include "purl.clickhouse.fullname" $ }}-headless</hostname>
            <port>{{ $.Values.clickhouse.cluster.keeper.port }}</port>
          </server>
          {{- end }}
        </raft_configuration>
      </keeper_server>

      <zookeeper>
        {{- range $i := until (int .Values.clickhouse.cluster.replicas) }}
        <node>
          <host>{{ include "purl.clickhouse.fullname" $ }}-{{ $i }}.{{ include "purl.clickhouse.fullname" $ }}-headless</host>
          <port>{{ $.Values.clickhouse.cluster.keeper.port }}</port>
        </node>
        {{- end }}
      </zookeeper>
      {{- end }}
    </clickhouse>
{{- end }}
