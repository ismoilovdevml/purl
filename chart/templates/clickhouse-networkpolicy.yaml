{{- if and .Values.clickhouse.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "purl.clickhouse.fullname" . }}
  labels:
    {{- include "purl.clickhouse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "purl.clickhouse.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Purl pods -> HTTP interface
    - from:
        - podSelector:
            matchLabels:
              {{- include "purl.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.clickhouse.port }}
    {{- if .Values.backup.enabled }}
    # Backup CronJob -> native protocol (clickhouse-client speaks 9000, not
    # the HTTP port). Without this rule an enabled NetworkPolicy silently
    # broke every scheduled backup.
    - from:
        - podSelector:
            matchLabels:
              {{- include "purl.backup.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 9000
    {{- end }}
    {{- if .Values.clickhouse.cluster.enabled }}
    # Inter-node ClickHouse traffic (native protocol + interserver + Keeper).
    # 9009 is interserver_http_port — the port ReplicatedMergeTree uses to
    # FETCH parts from a sibling replica. Omitting it did not fail the
    # install or the replica registration: replicas came up, log entries
    # propagated through Keeper, and every part fetch was dropped, so
    # system.replication_queue grew without bound and the replicas never
    # converged. Silent data divergence, no error anywhere.
    - from:
        - podSelector:
            matchLabels:
              {{- include "purl.clickhouse.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 8123
        - protocol: TCP
          port: {{ .Values.clickhouse.interserverHttpPort }}
        {{- if .Values.clickhouse.cluster.keeper.enabled }}
        - protocol: TCP
          port: {{ .Values.clickhouse.cluster.keeper.port }}
        {{- end }}
    {{- end }}
    {{- $cidrPeers := list }}
    {{- range .Values.networkPolicy.clickhouse.ingress.fromCIDRs }}
    {{- $cidrPeers = append $cidrPeers (dict "ipBlock" (dict "cidr" .)) }}
    {{- end }}
    {{- if $cidrPeers }}
    # networkPolicy.clickhouse.ingress.fromCIDRs — HTTP port only, on purpose.
    # This list exists for the kubelet: on CNIs that subject host traffic to
    # policy (Calico), health probes arrive from the NODE IP, and ClickHouse's
    # liveness probe is an httpGet on 8123. With no rule for the node IPs the
    # probe fails, the kubelet restart-loops ClickHouse, and the whole install
    # goes CrashLoopBackOff on what looks like a database fault. A probe never
    # needs the native protocol, so this rule does not open it.
    - from:
        {{- toYaml $cidrPeers | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.clickhouse.port }}
    {{- end }}
    {{- with .Values.networkPolicy.clickhouse.ingress.extraFrom }}
    # networkPolicy.clickhouse.ingress.extraFrom — HTTP *and* native 9000.
    # These peers are documented as a DBA namespace or an external ETL pod,
    # and both of those speak the native protocol: clickhouse-client, the Go
    # and Python drivers and every JDBC/ODBC bridge connect on 9000, not 8123.
    # Opening 8123 alone let the policy render, look correct, and time out
    # every real client — the same shape of silent drop as the missing 9009
    # interserver rule. The kubelet CIDR list above is deliberately kept off
    # this rule so node IPs do not gain native access as a side effect.
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.clickhouse.port }}
        - protocol: TCP
          port: 9000
    {{- end }}
  egress:
    # DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.backup.enabled }}
    # `BACKUP DATABASE ... TO S3(...)` streams server-side, so it is
    # ClickHouse — not the CronJob pod — that needs egress to the bucket.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range .Values.networkPolicy.egress.internetExcludeCIDRs }}
              - {{ . | quote }}
              {{- end }}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
    {{- if .Values.backup.s3.endpoint }}
    # Custom S3 endpoint ({{ .Values.backup.s3.endpoint }}). The ipBlock
    # above excludes private ranges, so an in-cluster MinIO needs its own
    # rule.
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 9000
    {{- end }}
    {{- end }}
    {{- if .Values.clickhouse.cluster.enabled }}
    # Outbound to other ClickHouse replicas. 9009 (interserver_http_port) is
    # the fetch side of the same replication path guarded on ingress above.
    - to:
        - podSelector:
            matchLabels:
              {{- include "purl.clickhouse.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 8123
        - protocol: TCP
          port: {{ .Values.clickhouse.interserverHttpPort }}
        {{- if .Values.clickhouse.cluster.keeper.enabled }}
        - protocol: TCP
          port: {{ .Values.clickhouse.cluster.keeper.port }}
        {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.clickhouse.egress.extraRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
