{{- if and .Values.clickhouse.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "purl.clickhouse.fullname" . }}
  labels:
    {{- include "purl.clickhouse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "purl.clickhouse.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic only from Purl pods
    - from:
        - podSelector:
            matchLabels:
              {{- include "purl.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.clickhouse.port }}
  egress:
    # Allow DNS resolution only
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
