{{- if and .Values.clickhouse.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "purl.clickhouse.fullname" . }}
  labels:
    {{- include "purl.clickhouse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "purl.clickhouse.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Purl pods
    - from:
        - podSelector:
            matchLabels:
              {{- include "purl.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.clickhouse.port }}
    {{- if .Values.clickhouse.cluster.enabled }}
    # Allow inter-node ClickHouse traffic (native protocol + Keeper)
    - from:
        - podSelector:
            matchLabels:
              {{- include "purl.clickhouse.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 8123
        {{- if .Values.clickhouse.cluster.keeper.enabled }}
        - protocol: TCP
          port: {{ .Values.clickhouse.cluster.keeper.port }}
        {{- end }}
    {{- end }}
  egress:
    # Allow DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.clickhouse.cluster.enabled }}
    # Allow outbound to other ClickHouse replicas
    - to:
        - podSelector:
            matchLabels:
              {{- include "purl.clickhouse.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 8123
        {{- if .Values.clickhouse.cluster.keeper.enabled }}
        - protocol: TCP
          port: {{ .Values.clickhouse.cluster.keeper.port }}
        {{- end }}
    {{- end }}
{{- end }}
