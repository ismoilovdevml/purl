{{- /*
ClickHouse server + query profile for the embedded ClickHouse (#106, #108).

Four keys, each mounted by clickhouse-statefulset.yaml:

  zz-purl-server.xml      -> config.d/   the small-install SERVER profile
  zz-purl-profile.xml    -> users.d/    the small-install QUERY profile
  zzz-purl-overrides.xml -> config.d/   clickhouse.serverConfig.* values the
                                        operator set, rendered LAST so they win
  purl-drop-disabled-system-logs.sh
                         -> /docker-entrypoint-initdb.d/  drops the system log
                                        tables the profile disables (#139)

The first two come verbatim from chart/files/clickhouse/ — the single source
of truth shared with docker/clickhouse/{config,users}.xml (compose), kept
identical by scripts/check_clickhouse_profile.py in `make helm-lint`.

Why a profile at all: ClickHouse sizes its caches and pools for a large
dedicated host. Mark / index-mark / primary-index caches default to 5 GiB and
the uncompressed cache to 8 GiB — each above a small pod's whole limit. On
a production cluster the uncompressed cache alone filled a 5 GiB pod in ~12 minutes
and every query failed with MEMORY_LIMIT_EXCEEDED (#106).

File names matter: ClickHouse merges config.d/ and users.d/ in sorted order,
so "zz-" sorts after the image's own fragments and "zzz-" after "zz-".
The server key keeps its 2.1.3 name, zz-purl-server.xml, on purpose: during an
upgrade the ConfigMap changes before the old pod is replaced, and an old pod
whose container restarts in that window must still find its subPath key.
*/ -}}
{{- if and .Values.clickhouse.enabled .Values.clickhouse.serverConfig.enabled }}
{{- $s := .Values.clickhouse.serverConfig }}
{{- $overrides := include "purl.clickhouse.serverOverrides" . | trim }}
{{- if or $s.smallProfile $overrides }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "purl.clickhouse.fullname" . }}-server
  labels:
    {{- include "purl.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
data:
  {{- if $s.smallProfile }}
  zz-purl-server.xml: |
    {{- .Files.Get "files/clickhouse/purl-small.xml" | nindent 4 }}
  zz-purl-profile.xml: |
    {{- .Files.Get "files/clickhouse/purl-small-profile.xml" | nindent 4 }}
  {{- end }}
  {{- if include "purl.clickhouse.dropDisabledSystemLogs" . }}
  # Mounted into /docker-entrypoint-initdb.d (clickhouse.dropDisabledSystemLogs,
  # #139). The image entrypoint runs it on every pod start against a server
  # that listens on 127.0.0.1 only, before the real server starts.
  purl-drop-disabled-system-logs.sh: |
    #!/bin/sh
    # Drop system log tables the small profile disables (<X_log remove="1"/>
    # in purl-small.xml), including renamed leftovers X_log_N. ClickHouse stops
    # writing them but never deletes them. Only the `system` database is
    # touched. Best effort: never fail the entrypoint, which would stop
    # ClickHouse from starting.
    PATTERN='^({{ include "purl.clickhouse.disabledSystemLogs" . }})(_[0-9]+)?$'
    # clickhouse-client takes the user and password from CLICKHOUSE_USER /
    # CLICKHOUSE_PASSWORD in the environment, so the password is not on argv.
    # Bounded: a hung call must not hold the entrypoint (and ClickHouse
    # start) forever. A timeout is just a failed call: warn and go on.
    ch() { clickhouse-client --host 127.0.0.1 --connect_timeout 5 --receive_timeout 60 --send_timeout 60 "$@"; }
    if ! TABLES=$(ch --param_re="$PATTERN" -q "SELECT name FROM system.tables WHERE database = 'system' AND match(name, {re:String}) ORDER BY name FORMAT TSVRaw"); then
      echo "purl: WARNING: could not list system tables; skipping the disabled system log cleanup" >&2
      exit 0
    fi
    if [ -z "$TABLES" ]; then
      echo "purl: no disabled system log tables on disk"
      exit 0
    fi
    for t in $TABLES; do
      if ch -q "DROP TABLE IF EXISTS system.\`$t\` SYNC"; then
        echo "purl: dropped system.$t (disabled by the small profile)"
      else
        echo "purl: WARNING: could not drop system.$t" >&2
      fi
    done
    exit 0
  {{- end }}
  {{- if $overrides }}
  zzz-purl-overrides.xml: |
    <clickhouse>
      {{- $overrides | nindent 6 }}
    </clickhouse>
  {{- end }}
{{- end }}
{{- end }}
