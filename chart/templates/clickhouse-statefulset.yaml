{{- if .Values.clickhouse.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "purl.clickhouse.fullname" . }}
  labels:
    {{- include "purl.clickhouse.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "purl.clickhouse.fullname" . }}-headless
  {{- if .Values.clickhouse.cluster.enabled }}
  replicas: {{ .Values.clickhouse.cluster.replicas }}
  {{- else }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "purl.clickhouse.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if .Values.clickhouse.cluster.enabled }}
      annotations:
        checksum/cluster-config: {{ include (print $.Template.BasePath "/clickhouse-cluster-config.yaml") . | sha256sum }}
      {{- end }}
      labels:
        {{- include "purl.clickhouse.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: clickhouse
          image: "{{ .Values.clickhouse.image.repository }}:{{ .Values.clickhouse.image.tag }}"
          imagePullPolicy: {{ .Values.clickhouse.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
            - name: native
              containerPort: 9000
              protocol: TCP
            {{- if and .Values.clickhouse.cluster.enabled .Values.clickhouse.cluster.keeper.enabled }}
            - name: keeper
              containerPort: {{ .Values.clickhouse.cluster.keeper.port }}
              protocol: TCP
            {{- end }}
          env:
            - name: CLICKHOUSE_DB
              value: {{ .Values.clickhouse.database | quote }}
            - name: CLICKHOUSE_USER
              value: "default"
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
            {{- if .Values.clickhouse.password }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "purl.fullname" . }}
                  key: PURL_CLICKHOUSE_PASSWORD
            {{- end }}
            {{- if and .Values.clickhouse.cluster.enabled .Values.clickhouse.cluster.keeper.enabled }}
            - name: CH_KEEPER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
            {{- end }}
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          resources:
            {{- toYaml .Values.clickhouse.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: logs
              mountPath: /var/log/clickhouse-server
            {{- if .Values.clickhouse.cluster.enabled }}
            - name: cluster-config
              mountPath: /etc/clickhouse-server/config.d/cluster.xml
              subPath: cluster.xml
            {{- end }}
      {{- if .Values.clickhouse.cluster.enabled }}
      initContainers:
        - name: set-keeper-id
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              # Extract ordinal index from hostname (e.g., purl-clickhouse-0 -> 1)
              ORDINAL=$(echo $HOSTNAME | grep -o '[0-9]*$')
              KEEPER_ID=$((ORDINAL + 1))
              echo "Setting CH_KEEPER_ID=$KEEPER_ID for $HOSTNAME"
              # Write keeper ID to shared file for the main container
              echo "$KEEPER_ID" > /etc/clickhouse-keeper/keeper_id
          volumeMounts:
            - name: keeper-id
              mountPath: /etc/clickhouse-keeper
      {{- end }}
      volumes:
        - name: logs
          emptyDir: {}
        {{- if not .Values.clickhouse.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- if .Values.clickhouse.cluster.enabled }}
        - name: cluster-config
          configMap:
            name: {{ include "purl.clickhouse.fullname" . }}-cluster
        - name: keeper-id
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.clickhouse.cluster.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "purl.clickhouse.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      {{- end }}
  {{- if .Values.clickhouse.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.clickhouse.persistence.accessModes | nindent 10 }}
        {{- if .Values.clickhouse.persistence.storageClass }}
        storageClassName: {{ .Values.clickhouse.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.clickhouse.persistence.size }}
  {{- end }}
{{- end }}
