{{- if .Values.clickhouse.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "purl.clickhouse.fullname" . }}
  labels:
    {{- include "purl.clickhouse.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "purl.clickhouse.fullname" . }}-headless
  {{- if .Values.clickhouse.cluster.enabled }}
  replicas: {{ .Values.clickhouse.cluster.replicas }}
  {{- else }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "purl.clickhouse.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if .Values.clickhouse.cluster.enabled }}
        checksum/cluster-config: {{ include (print $.Template.BasePath "/clickhouse-cluster-config.yaml") . | sha256sum }}
        {{- end }}
        {{- if ne .Values.clickhouse.user "default" }}
        checksum/users-config: {{ include (print $.Template.BasePath "/clickhouse-users-config.yaml") . | sha256sum }}
        {{- end }}
        {{- if not .Values.purl.existingSecret }}
        # Roll ClickHouse on password rotation — env values come from the
        # Secret via secretKeyRef, so only a pod template change restarts it.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
      labels:
        {{- include "purl.clickhouse.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.clickhouse.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: clickhouse
          image: "{{ .Values.clickhouse.image.repository }}:{{ .Values.clickhouse.image.tag }}"
          imagePullPolicy: {{ .Values.clickhouse.image.pullPolicy }}
          {{- with .Values.clickhouse.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
            - name: native
              containerPort: 9000
              protocol: TCP
            {{- if and .Values.clickhouse.cluster.enabled .Values.clickhouse.cluster.keeper.enabled }}
            - name: keeper
              containerPort: {{ .Values.clickhouse.cluster.keeper.port }}
              protocol: TCP
            {{- end }}
          env:
            - name: CLICKHOUSE_DB
              value: {{ .Values.clickhouse.database | quote }}
            - name: CLICKHOUSE_USER
              value: "default"
            # Access management lets the `default` user CREATE USER / GRANT.
            # Purl never needs it, and leaving it on turns any connection
            # that reaches the default user into a superuser factory.
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: {{ ternary "1" "0" .Values.clickhouse.defaultAccessManagement | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "purl.secretName" . }}
                  key: PURL_CLICKHOUSE_PASSWORD
                  {{- if .Values.purl.existingSecret }}
                  optional: true
                  {{- end }}
            {{- if ne .Values.clickhouse.user "default" }}
            # Consumed via from_env in users.d/app-user.xml (see
            # clickhouse-users-config.yaml) to create the app user.
            - name: PURL_APP_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "purl.secretName" . }}
                  key: PURL_CLICKHOUSE_PASSWORD
                  {{- if .Values.purl.existingSecret }}
                  optional: true
                  {{- end }}
            {{- end }}
            {{- if and .Values.backup.enabled (not .Values.backup.s3.credentialsInQuery) }}
            # Read by config.d/backup-s3.xml via from_env, so the BACKUP
            # statement itself carries no credentials (they would otherwise
            # be recorded verbatim in system.query_log).
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backup.s3.existingSecret }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backup.s3.existingSecret }}
                  key: AWS_SECRET_ACCESS_KEY
            {{- end }}
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          resources:
            {{- toYaml .Values.clickhouse.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: logs
              mountPath: /var/log/clickhouse-server
            {{- if .Values.clickhouse.cluster.enabled }}
            - name: cluster-config
              mountPath: /etc/clickhouse-server/config.d/cluster.xml
              subPath: cluster.xml
            {{- if .Values.clickhouse.cluster.keeper.enabled }}
            # Written by the set-keeper-id init container below. It carries
            # ONLY <server_id>, merged into the <keeper_server> block from
            # cluster.xml by ClickHouse's config.d merge.
            - name: keeper-id
              mountPath: /etc/clickhouse-server/config.d/keeper-id.xml
              subPath: keeper-id.xml
            {{- end }}
            {{- end }}
            {{- if ne .Values.clickhouse.user "default" }}
            - name: users-config
              mountPath: /etc/clickhouse-server/users.d/app-user.xml
              subPath: app-user.xml
            {{- end }}
            {{- if and .Values.backup.enabled (not .Values.backup.s3.credentialsInQuery) }}
            - name: backup-s3-config
              mountPath: /etc/clickhouse-server/config.d/backup-s3.xml
              subPath: backup-s3.xml
            {{- end }}
      {{- if and .Values.clickhouse.cluster.enabled .Values.clickhouse.cluster.keeper.enabled }}
      initContainers:
        # Keeper server_id must be 1..N to match <raft_configuration>, but a
        # pod can only expose its 0-based ordinal (apps.kubernetes.io/pod-index)
        # and there is no arithmetic in a fieldRef. The previous version set
        # CH_KEEPER_ID straight from the 0-based index while raft used 1-based
        # ids, so no node ever matched its own raft entry and the quorum never
        # formed. This container computes the id and writes the config
        # fragment the server actually reads.
        - name: set-keeper-id
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              ORDINAL="${HOSTNAME##*-}"
              KEEPER_ID=$((ORDINAL + 1))
              echo "keeper server_id=$KEEPER_ID for $HOSTNAME"
              cat > /keeper-id/keeper-id.xml <<EOF
              <clickhouse>
                <keeper_server>
                  <server_id>$KEEPER_ID</server_id>
                </keeper_server>
              </clickhouse>
              EOF
          {{- with .Values.clickhouse.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: keeper-id
              mountPath: /keeper-id
      {{- end }}
      volumes:
        - name: logs
          emptyDir:
            sizeLimit: {{ .Values.clickhouse.logsSizeLimit }}
        {{- if not .Values.clickhouse.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- if .Values.clickhouse.cluster.enabled }}
        - name: cluster-config
          configMap:
            name: {{ include "purl.clickhouse.fullname" . }}-cluster
        - name: keeper-id
          emptyDir: {}
        {{- end }}
        {{- if ne .Values.clickhouse.user "default" }}
        - name: users-config
          configMap:
            name: {{ include "purl.clickhouse.fullname" . }}-users
        {{- end }}
        {{- if and .Values.backup.enabled (not .Values.backup.s3.credentialsInQuery) }}
        - name: backup-s3-config
          configMap:
            name: {{ include "purl.clickhouse.fullname" . }}-backup-s3
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.clickhouse.cluster.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "purl.clickhouse.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      {{- end }}
  {{- if .Values.clickhouse.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.clickhouse.persistence.accessModes | nindent 10 }}
        {{- if .Values.clickhouse.persistence.storageClass }}
        storageClassName: {{ .Values.clickhouse.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.clickhouse.persistence.size }}
  {{- end }}
{{- end }}
