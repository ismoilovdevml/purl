{{- if and .Values.purl.redis.enabled (not .Values.purl.redis.url) }}
{{- fail "purl.redis.enabled=true requires purl.redis.url — the chart does not deploy Redis. Without the URL, live-tail broadcast stays single-replica and the Prometheus counters stay per-worker, with nothing to indicate it but purl_metrics_shared=0." }}
{{- end }}
{{- /*
  A string "false" is truthy in a template, so `ternary` over it would render
  durable for a user who asked for fast. Accept only a real boolean.
*/}}
{{- if not (kindIs "bool" .Values.purl.ingestDurable) }}
{{- fail (printf "purl.ingestDurable must be a boolean (true or false), got %v" .Values.purl.ingestDurable) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "purl.fullname" . }}
  labels:
    {{- include "purl.labels" . | nindent 4 }}
data:
  PURL_HOST: "0.0.0.0"
  PURL_PORT: {{ .Values.purl.port | quote }}
  PURL_STORAGE_TYPE: {{ .Values.purl.storageType | quote }}
  PURL_CLICKHOUSE_HOST: {{ include "purl.clickhouse.host" . | quote }}
  PURL_CLICKHOUSE_PORT: {{ .Values.clickhouse.port | quote }}
  PURL_CLICKHOUSE_DATABASE: {{ .Values.clickhouse.database | quote }}
  PURL_CLICKHOUSE_USER: {{ .Values.clickhouse.user | quote }}
  PURL_RETENTION_DAYS: {{ .Values.purl.retentionDays | quote }}
  PURL_AUTH_ENABLED: {{ ternary "1" "0" .Values.purl.authEnabled | quote }}
  {{- /*
    "1"/"0", the spelling PURL_AUTH_ENABLED uses; Purl reads it through
    Purl::Config::EnvMap::bool_text, which accepts 1/0, true/false, yes/no,
    on/off. The checksum/config annotation on the Deployment rolls the pods
    when this changes.
  */}}
  PURL_INGEST_DURABLE: {{ ternary "1" "0" .Values.purl.ingestDurable | quote }}
  {{- if .Values.clickhouse.cluster.enabled }}
  PURL_CLICKHOUSE_CLUSTER: {{ .Values.clickhouse.cluster.name | quote }}
  {{- end }}
  {{- /*
    PURL_REDIS_URL drives two things: cross-replica live-tail broadcast AND
    the shared metrics counter store (Purl::Store::Counter). Without it the
    Prometheus counters are per-prefork-worker and every rate() reads low.
  */}}
  {{- if and .Values.purl.redis.enabled .Values.purl.redis.url }}
  PURL_REDIS_URL: {{ .Values.purl.redis.url | quote }}
  {{- end }}
  {{- /*
    Where Purl::Broadcast::Prefork keeps the cross-worker live-tail spool when
    Redis is not configured. Only emitted when the operator moved it off the
    config volume — otherwise the app default (<config dir>/live-tail.spool)
    applies and there is nothing to pin here.
  */}}
  {{- $spoolPath := .Values.purl.broadcastSpool.path }}
  {{- if and (not $spoolPath) .Values.purl.broadcastSpool.emptyDir }}
  {{- $spoolPath = "/app/spool/live-tail.spool" }}
  {{- end }}
  {{- with $spoolPath }}
  PURL_BROADCAST_SPOOL: {{ . | quote }}
  {{- end }}
  {{- /*
    Telegram forum topic id (message_thread_id). Deliberately NOT in the
    Secret: it is a routing hint, not a credential, and keeping it here means
    it survives purl.existingSecret installs where the chart templates no
    telegram values at all.
  */}}
  {{- with .Values.purl.telegram.threadId }}
  PURL_TELEGRAM_THREAD_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.purl.backupQueryTimeout }}
  PURL_BACKUP_QUERY_TIMEOUT: {{ . | quote }}
  {{- end }}
  {{- with .Values.purl.metricsTtl }}
  PURL_METRICS_TTL: {{ . | quote }}
  {{- end }}
  {{- with .Values.purl.gracefulTimeout }}
  PURL_GRACEFUL_TIMEOUT: {{ . | quote }}
  {{- end }}
  {{- with .Values.purl.sessionMaxAge }}
  PURL_SESSION_MAX_AGE: {{ . | quote }}
  {{- end }}
  {{- /*
    Accepts a list or a comma-separated string; the app splits on commas
    (Purl::Util::ClientIP::parse_proxy_list). Empty = trust only the socket peer.
  */}}
  {{- with .Values.purl.trustedProxies }}
  PURL_TRUSTED_PROXIES: {{ (kindIs "slice" .) | ternary (join "," .) (toString .) | quote }}
  {{- end }}
  {{- if .Values.backup.enabled }}
  {{- /*
    The app-side backup manager (restore, delete, retention cleanup) talks to
    S3 directly, not only the CronJob. Without these it cannot resolve the
    bucket and delete_backup dies rather than orphan an S3 object.
    Credentials come from backup.s3.existingSecret via envFrom on the
    Deployment — never from a ConfigMap.
  */}}
  PURL_BACKUP_S3_ENABLED: "1"
  PURL_BACKUP_S3_BUCKET: {{ .Values.backup.s3.bucket | quote }}
  PURL_BACKUP_S3_REGION: {{ .Values.backup.s3.region | quote }}
  PURL_BACKUP_S3_PREFIX: {{ .Values.backup.s3.prefix | quote }}
  {{- with .Values.backup.s3.endpoint }}
  PURL_BACKUP_S3_ENDPOINT: {{ . | quote }}
  {{- end }}
  PURL_BACKUP_RETENTION_DAYS: {{ .Values.backup.retentionDays | quote }}
  {{- end }}
