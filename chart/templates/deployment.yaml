{{- /*
Guard: live tail across POD boundaries needs Redis.

Without purl.redis, the broadcast backend is Purl::Broadcast::Prefork, which
carries messages between the prefork workers of one container through an
append-only spool FILE. A file reaches only the workers that share a
filesystem, so with a second pod the WebSocket lands on one pod and sees just
that pod's slice of the ingest. Nothing errors, nothing reconnects, no metric
moves — the user simply gets a fraction of their logs. Fail the render instead
of shipping a silently half-working feature.

autoscaling.maxReplicas counts: an HPA that CAN reach 2 pods breaks tail the
moment it does, and that scale-up is exactly when nobody is watching.
*/ -}}
{{- $tailReplicas := int (include "purl.replicaCount" .) }}
{{- if .Values.autoscaling.enabled }}
{{- $tailReplicas = max $tailReplicas (int .Values.autoscaling.maxReplicas) }}
{{- end }}
{{- if and (gt $tailReplicas 1) (not (and .Values.purl.redis.enabled .Values.purl.redis.url)) }}
{{- fail (printf "%d Purl replicas without Redis: live tail would silently break. The single-pod broadcast backend is a spool FILE on the config volume, so a tail session only receives what the pod holding the WebSocket ingested — the other pods' logs never arrive and nothing reports an error. Either set purl.redis.enabled=true with purl.redis.url (also makes the Prometheus counters fleet-wide), or keep replicaCount=1 with autoscaling.enabled=false. PURL_WORKERS inside one pod is unaffected — the spool covers those." $tailReplicas) }}
{{- end }}

{{- /*
Guard: a ReadWriteOnce config PVC can only be attached to one node, so a
second Purl pod either lands on the same node by luck or hangs forever with
"Multi-Attach error for volume". Fail at render time rather than at 3am.
*/ -}}
{{- if and .Values.config.volume.enabled (has "ReadWriteOnce" .Values.config.volume.accessModes) }}
{{- $replicas := int (include "purl.replicaCount" .) }}
{{- if .Values.autoscaling.enabled }}
{{- $replicas = max $replicas (int .Values.autoscaling.maxReplicas) }}
{{- end }}
{{- if gt $replicas 1 }}
{{- fail "config.volume.accessModes=[ReadWriteOnce] supports exactly one Purl replica (autoscaling.maxReplicas counts). Use a ReadWriteMany storage class (config.volume.accessModes: [ReadWriteMany]), or set config.volume.enabled=false and accept that dashboard users/settings do not survive a restart." }}
{{- end }}
{{- if ne .Values.updateStrategy.type "Recreate" }}
{{- fail "config.volume.accessModes=[ReadWriteOnce] requires updateStrategy.type=Recreate — a RollingUpdate attaches the volume to the new pod before the old one releases it and the rollout deadlocks on Multi-Attach." }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "purl.fullname" . }}
  labels:
    {{- include "purl.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: {{ .Values.updateStrategy.type }}
    {{- if eq .Values.updateStrategy.type "RollingUpdate" }}
    {{- with .Values.updateStrategy.rollingUpdate }}
    rollingUpdate:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "purl.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "purl.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "purl.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.clickhouse.enabled }}
      initContainers:
        - name: wait-for-clickhouse
          image: busybox:1.36
          # The init container is subject to the same Pod Security Standards
          # as the main one — without this block the pod is rejected on a
          # namespace enforcing `restricted`.
          # readOnlyRootFilesystem is forced true regardless of
          # .Values.securityContext: that value is false because the Purl
          # container writes /app/config and /app/data, but this container
          # only runs `wget --spider` in a loop and writes nothing at all.
          # `default dict` is load-bearing: an empty `securityContext:` key in
          # a user's -f values file is null, and deepCopy on a nil value is a
          # Go reflect panic ("reflect.Value.Type on zero Value") instead of a
          # chart message.
          securityContext:
            {{- toYaml (mergeOverwrite (deepCopy (default dict .Values.securityContext)) (dict "readOnlyRootFilesystem" true)) | nindent 12 }}
          resources:
            limits:
              cpu: 100m
              memory: 32Mi
              ephemeral-storage: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
              ephemeral-storage: 16Mi
          command:
            - sh
            - -c
            - |
              until wget -q --spider http://{{ include "purl.clickhouse.fullname" . }}:{{ .Values.clickhouse.port }}/ping; do
                echo "Waiting for ClickHouse..."
                sleep 2
              done
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "purl.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.purl.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "purl.fullname" . }}
            - secretRef:
                name: {{ include "purl.secretName" . }}
            {{- if and .Values.backup.enabled .Values.backup.s3.existingSecret }}
            {{- /*
              AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY. The app itself now
              reaches S3 — restore, delete_backup and retention cleanup, not
              just the CronJob's upload. Without these delete_backup refuses
              to run rather than orphan the S3 object behind a deleted record.

              `optional: true` here is a DELIBERATE exception to the rule
              applied to PURL_CLICKHOUSE_PASSWORD (loud CreateContainerConfigError
              over an empty value), and the two are not the same trade-off.
              This ref is on the main Purl Deployment: making it mandatory
              means a typo in backup.s3.existingSecret stops log ingestion,
              the dashboard and alerting for the whole install because an
              optional backup feature is misconfigured. The degraded mode is
              also bounded and self-announcing — delete_backup and restore
              refuse to run instead of orphaning objects — where an empty
              database password was an open database. If this ever becomes
              mandatory, add it to the CI assertion in ci.yml alongside the
              PURL_CLICKHOUSE_PASSWORD check.
            */}}
            - secretRef:
                name: {{ .Values.backup.s3.existingSecret }}
                optional: true
            {{- end }}
          {{- /*
            Split probes. All three used to point at /api/health, which
            verifies ClickHouse — so a database outage made the kubelet kill
            every Purl pod, turning a recoverable dependency failure into a
            fleet-wide CrashLoopBackOff that could not recover even once
            ClickHouse came back.

              /api/health/live   process only, touches nothing external
              /api/health/ready  includes the ClickHouse check
              /api/health        legacy, same as /ready (kept for old images)

            liveness MUST stay on /live. Readiness failing only removes the
            pod from the Service endpoints; it rejoins by itself.
          */}}
          startupProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.config.volume.enabled }}
            # Writable: Purl persists settings.json and dashboard users
            # under /app/config at runtime.
            - name: config
              mountPath: /app/config
            {{- end }}
            {{- if .Values.purl.broadcastSpool.emptyDir }}
            # Live-tail spool only. Pod-local on purpose: the spool is a
            # transport, not state, and keeping it off the config PVC keeps
            # per-batch appends away from a volume sized for a few JSON files.
            - name: broadcast-spool
              mountPath: /app/spool
            {{- end }}
      volumes:
        {{- if .Values.config.volume.enabled }}
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "purl.fullname" . }}-config
        {{- end }}
        {{- if .Values.purl.broadcastSpool.emptyDir }}
        - name: broadcast-spool
          emptyDir:
            sizeLimit: {{ .Values.purl.broadcastSpool.sizeLimit }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
