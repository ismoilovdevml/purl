{{- if .Values.networkPolicy.enabled }}
{{- /*
Ingress used to contain `- from: [{namespaceSelector: {}}]`, which selects
EVERY namespace in the cluster — i.e. the policy was enabled but allowed all
pod traffic anyway. It is now an explicit allow-list.

Egress used to permit only ClickHouse + DNS. That silently killed every
outbound feature Purl has: Telegram/Slack/webhook alerts all go out over
443. networkPolicy.egress.allowInternet covers those.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "purl.fullname" . }}
  labels:
    {{- include "purl.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "purl.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Vector DaemonSet -> /api/logs
    {{- if .Values.vector.enabled }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "purl.name" . }}-vector
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: {{ .Values.purl.port }}
    {{- end }}
    {{- $peers := list }}
    {{- if .Values.networkPolicy.ingress.fromSameNamespace }}
    {{- $peers = append $peers (dict "podSelector" dict) }}
    {{- end }}
    {{- range .Values.networkPolicy.ingress.fromNamespaces }}
    {{- $peers = append $peers (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" .))) }}
    {{- end }}
    {{- range .Values.networkPolicy.ingress.fromCIDRs }}
    {{- $peers = append $peers (dict "ipBlock" (dict "cidr" .)) }}
    {{- end }}
    {{- range .Values.networkPolicy.ingress.extraFrom }}
    {{- $peers = append $peers . }}
    {{- end }}
    {{- if .Values.metrics.serviceMonitor.enabled }}
    {{- /*
      This rule used to be `- from: [{namespaceSelector: {}}]` on
      .Values.purl.port. namespaceSelector:{} matches EVERY namespace, and
      the port is the application port, not a separate metrics port — so
      simply turning on metrics.serviceMonitor re-opened the whole
      allow-list this policy exists to enforce, cluster-wide, on the same
      port that serves /api/logs and the dashboard. Naming the Prometheus
      namespace is required instead.
    */}}
    {{- if not .Values.metrics.prometheusNamespace }}
    {{- if dig "serviceMonitor" "namespace" "" .Values.metrics }}
    {{- fail (printf "metrics.serviceMonitor.namespace was RENAMED to metrics.prometheusNamespace in chart 2.0.0. Move your value: metrics.prometheusNamespace=%q. The old nesting read as \"the namespace to create the ServiceMonitor in\" (its meaning in most charts); it has always meant \"the namespace Prometheus itself runs in\", and it is used only to build the NetworkPolicy scrape rule. The ServiceMonitor is created in the release namespace either way." (dig "serviceMonitor" "namespace" "" .Values.metrics)) }}
    {{- end }}
    {{- fail "metrics.serviceMonitor.enabled=true with networkPolicy.enabled=true requires metrics.prometheusNamespace — the namespace PROMETHEUS runs in (e.g. \"monitoring\"), not the release namespace. The scrape rule opens purl.port to it, and purl.port also serves /api/logs and the dashboard; it was previously opened to every namespace in the cluster, which silently reopened the whole allow-list. There is no way around this guard: networkPolicy.ingress.extraFrom adds peers but does not satisfy it. To render without setting it, turn off metrics.serviceMonitor.enabled or networkPolicy.enabled." }}
    {{- end }}
    # Prometheus scrape, restricted to the namespace Prometheus runs in.
    # Matched on kubernetes.io/metadata.name, set by Kubernetes on every
    # namespace since 1.22.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.metrics.prometheusNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.purl.port }}
    {{- end }}
    {{- if $peers }}
    - from:
        {{- toYaml $peers | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.purl.port }}
    {{- else }}
    # No ingress peers configured beyond Vector: nothing else — not the
    # ingress controller, not a NodePort client — can reach Purl. Set
    # networkPolicy.ingress.fromSameNamespace / fromNamespaces / fromCIDRs.
    {{- end }}
  egress:
    # DNS. Port-only (no namespaceSelector) so it also works on clusters
    # where CoreDNS does not live in kube-system.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.clickhouse.enabled }}
    # ClickHouse HTTP interface. The native port 9000 is used by the backup
    # CronJob, which is a separate pod with its own labels and is therefore
    # not selected by this policy.
    - to:
        - podSelector:
            matchLabels:
              {{- include "purl.clickhouse.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.clickhouse.port }}
    {{- else }}
    # External ClickHouse ({{ .Values.clickhouse.host }}:{{ .Values.clickhouse.port }})
    # is reached through the allowInternet rule below; if allowInternet is
    # off, add an explicit ipBlock via networkPolicy.egress.extraRules.
    {{- end }}
    {{- if and .Values.purl.redis.enabled .Values.purl.redis.url }}
    # Redis (cross-replica live-tail broadcast).
    - ports:
        - protocol: TCP
          port: 6379
    {{- end }}
    {{- if .Values.networkPolicy.egress.allowInternet }}
    # Outbound to the public internet: Telegram / Slack / alert webhooks.
    # Private ranges are excluded so this
    # does not quietly become "may talk to anything in the cluster".
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range .Values.networkPolicy.egress.internetExcludeCIDRs }}
              - {{ . | quote }}
              {{- end }}
      ports:
        {{- range .Values.networkPolicy.egress.internetPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.egress.extraRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
