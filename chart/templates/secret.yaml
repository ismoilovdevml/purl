{{- /*
Skipped entirely when purl.existingSecret is set: the operator manages the
Secret out-of-band, so no credential is templated into the release — nothing
sensitive shows up in `helm get values` or the release history.
*/ -}}
{{- if not .Values.purl.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "purl.fullname" . }}
  labels:
    {{- include "purl.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /*
    Normalisation of the clusterless lookup lives in purl.existingSecretData —
    see the comment there for why .data must never be indexed directly.
  */}}
  {{- $existingData := (include "purl.existingSecretData" . | fromJson) }}
  {{- if .Values.purl.sessionSecret }}
  PURL_SESSION_SECRET: {{ .Values.purl.sessionSecret | quote }}
  {{- else if index $existingData "PURL_SESSION_SECRET" }}
  PURL_SESSION_SECRET: {{ index $existingData "PURL_SESSION_SECRET" | b64dec | quote }}
  {{- else }}
  {{- include "purl.assertGeneratedSecretAllowed" (dict "root" . "key" "PURL_SESSION_SECRET" "setting" "purl.sessionSecret") }}
  PURL_SESSION_SECRET: {{ randAlphaNum 64 | quote }}
  {{- end }}
  {{- /*
    PURL_API_KEYS must ALWAYS be present. The Vector DaemonSet mounts it via
    secretKeyRef without optional:true, so when purl.apiKeys was left empty
    the key was omitted entirely and every Vector pod failed with
    CreateContainerConfigError — i.e. the default install shipped a broken
    log collector. Generate one and keep it stable across upgrades, the same
    way PURL_SESSION_SECRET is handled above.
  */ -}}
  {{- if .Values.purl.apiKeys }}
  PURL_API_KEYS: {{ .Values.purl.apiKeys | quote }}
  {{- else if index $existingData "PURL_API_KEYS" }}
  PURL_API_KEYS: {{ index $existingData "PURL_API_KEYS" | b64dec | quote }}
  {{- else }}
  {{- include "purl.assertGeneratedSecretAllowed" (dict "root" . "key" "PURL_API_KEYS" "setting" "purl.apiKeys") }}
  PURL_API_KEYS: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- /*
    Always present, never empty — see the purl.clickhouse.password helper.
    An empty clickhouse.password used to omit this key entirely, which left
    the ClickHouse app user passwordless while still accepting connections
    from ::/0.
  */}}
  PURL_CLICKHOUSE_PASSWORD: {{ include "purl.clickhouse.password" . | quote }}
  {{- if .Values.purl.telegram.botToken }}
  PURL_TELEGRAM_BOT_TOKEN: {{ .Values.purl.telegram.botToken | quote }}
  {{- end }}
  {{- if .Values.purl.telegram.chatId }}
  PURL_TELEGRAM_CHAT_ID: {{ .Values.purl.telegram.chatId | quote }}
  {{- end }}
  {{- if .Values.purl.slack.webhookUrl }}
  PURL_SLACK_WEBHOOK_URL: {{ .Values.purl.slack.webhookUrl | quote }}
  {{- end }}
  {{- if .Values.purl.slack.channel }}
  PURL_SLACK_CHANNEL: {{ .Values.purl.slack.channel | quote }}
  {{- end }}
  {{- if .Values.purl.alertWebhook.url }}
  PURL_ALERT_WEBHOOK_URL: {{ .Values.purl.alertWebhook.url | quote }}
  {{- end }}
  {{- if .Values.purl.alertWebhook.token }}
  PURL_ALERT_WEBHOOK_TOKEN: {{ .Values.purl.alertWebhook.token | quote }}
  {{- end }}
{{- end }}
