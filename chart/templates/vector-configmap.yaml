{{- if .Values.vector.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "purl.fullname" . }}-vector
  labels:
    {{- include "purl.labels" . | nindent 4 }}
    app.kubernetes.io/component: vector
data:
  vector.toml: |
    data_dir = "/var/lib/vector"

    [api]
    enabled = true
    address = "0.0.0.0:8686"

    [sources.kubernetes]
    type = "kubernetes_logs"
    auto_partial_merge = true
    # Self-exclusion is load-bearing. Vector and Purl both log every ingest;
    # if their own pod logs are collected, each batch produces new log lines
    # which produce a new batch. That feedback loop is what grew the dev
    # ClickHouse volume to 20 GB and filled the node.
    # The release name prefix catches purl-*, purl-vector-*, purl-clickhouse-*.
    exclude_paths_glob_patterns = [
      "**/kube-system_*/**",
      "**/vector-*/**",
      "**/*_{{ include "purl.fullname" . }}-*_*/**",
      "**/*_{{ include "purl.fullname" . }}_*/**",
    ]

    {{- if .Values.vector.journald.enabled }}

    [sources.journald]
    type = "journald"
    include_units = {{ .Values.vector.journald.includeUnits | toJson }}
    {{- end }}

    [transforms.exclude_internal]
    type = "filter"
    inputs = ["kubernetes"]
    condition = '''
    ns = string(.kubernetes.pod_namespace) ?? ""
    pod = string(.kubernetes.pod_name) ?? ""
    # Second line of defence behind exclude_paths_glob_patterns: drop Purl's
    # own pods so the collector can never feed on its own output.
    !(ns == "kube-system" || starts_with(pod, "vector-") || starts_with(pod, "{{ include "purl.fullname" . }}"))
    '''

    [transforms.parsed]
    type = "remap"
    inputs = ["exclude_internal"]
    source = '''
    svc, svc_err = get(.kubernetes.pod_labels, ["app"])
    if svc_err != null || svc == null {
      svc, svc_err = get(.kubernetes.pod_labels, ["app.kubernetes.io/name"])
    }
    if svc_err != null || svc == null {
      svc = .kubernetes.pod_name
    }
    .service = to_string!(svc)

    host_val = .kubernetes.pod_node_name
    .host = if host_val != null { to_string!(host_val) } else { "unknown" }

    .raw = .message
    .timestamp = now()

    pod_str = to_string(.kubernetes.pod_name) ?? ""
    ns_str = to_string(.kubernetes.pod_namespace) ?? ""
    cont_str = to_string(.kubernetes.container_name) ?? ""
    node_str = to_string(.kubernetes.pod_node_name) ?? ""
    cluster_str = get_env_var("CLUSTER_NAME") ?? "default"

    # Pod owner reference enrichment
    deploy_val, deploy_err = get(.kubernetes.pod_labels, ["app.kubernetes.io/instance"])
    if deploy_err != null || deploy_val == null {
      deploy_val, deploy_err = get(.kubernetes.pod_labels, ["app.kubernetes.io/name"])
    }
    if deploy_err != null || deploy_val == null {
      deploy_val = .kubernetes.pod_name
    }
    deployment_str = to_string!(deploy_val)

    # Annotation enrichment
    team_val = get(.kubernetes.pod_annotations, ["team"]) ?? null
    env_val = get(.kubernetes.pod_annotations, ["environment"]) ?? null
    version_val = get(.kubernetes.pod_annotations, ["app.kubernetes.io/version"]) ?? null

    # Purl's ingest API stores meta only when it arrives as an object; an
    # encode_json string is discarded.
    .meta = {
      "pod": pod_str,
      "namespace": ns_str,
      "container": cont_str,
      "node": node_str,
      "cluster": cluster_str,
      "source": "kubernetes",
      "deployment": deployment_str,
      "team": to_string(team_val) ?? "",
      "environment": to_string(env_val) ?? "",
      "version": to_string(version_val) ?? ""
    }

    .trace_id = ""
    .request_id = ""
    .span_id = ""
    .parent_span_id = ""

    # BEGIN purl-level-detection (#111)
    # Identical in chart/templates/vector-configmap.yaml, deploy/vector/vector.toml
    # and install.sh (tests/vector/run.sh fails if they drift, then runs the
    # cases in tests/vector/level-detection.toml against all three).
    # A JSON body's string "message" (else "msg") field becomes .message.
    # Level, first match wins:
    #   1. JSON field level / severity / lvl / log.level. Strings are upper-cased
    #      and synonyms folded as lib/Purl/Util/Level.pm does; unknown names are
    #      kept. Numbers: 0-7 syslog severity, 10-60 pino/bunyan scale.
    #   2. a level token at the start of the line, after optional timestamp or
    #      [bracketed] tokens: "ERROR x", "[warn] x", "error: x", klog "E0924 ...".
    #   3. level= / lvl= / severity= in a logfmt line (one that starts with key=).
    #   4. within the first 120 characters: an UPPERCASE ERROR/WARN/FATAL/PANIC
    #      word, [error] or <Error> markers, a tab-delimited level (zap), an
    #      "app[1]: error:" syslog prefix, or a Java/Python exception header.
    #   Otherwise INFO. A lowercase level word in free text ("user clicked debug
    #   panel", "request failed") never decides the level.
    lv_raw = string(.message) ?? ""
    parsed = parse_json(lv_raw) ?? null
    if is_object(parsed) {
      lv_body = parsed.message
      if !is_string(lv_body) { lv_body = parsed.msg }
      if is_string(lv_body) { .message = lv_body }
    }
    msg = string(.message) ?? ""
    lv_syn = {
      "WARNING": "WARN", "ERR": "ERROR", "CRIT": "FATAL", "CRITICAL": "FATAL",
      "EMERG": "FATAL", "EMERGENCY": "FATAL", "ALERT": "FATAL", "PANIC": "FATAL",
      "NOTICE": "INFO"
    }
    level = ""
    lv_src = null
    if is_object(parsed) {
      lv_src = parsed.level
      if is_nullish(lv_src) { lv_src = parsed.severity }
      if is_nullish(lv_src) { lv_src = parsed.lvl }
      if is_nullish(lv_src) { lv_src = get(parsed, ["log.level"]) ?? null }
      if is_nullish(lv_src) { lv_src = parsed.log.level }
    }
    if is_string(lv_src) {
      lv_tok = upcase(strip_whitespace(string!(lv_src)))
      level = string(get(lv_syn, [lv_tok]) ?? null) ?? lv_tok
    } else if is_integer(lv_src) || is_float(lv_src) {
      lv_n = to_int(lv_src) ?? -1
      level = if lv_n < 0 { "" } else if lv_n <= 2 { "FATAL" } else if lv_n == 3 { "ERROR" } else if lv_n == 4 { "WARN" } else if lv_n <= 6 { "INFO" } else if lv_n == 7 { "DEBUG" } else if lv_n < 20 { "TRACE" } else if lv_n < 30 { "DEBUG" } else if lv_n < 40 { "INFO" } else if lv_n < 50 { "WARN" } else if lv_n < 60 { "ERROR" } else { "FATAL" }
    }
    lv_tok = ""
    if level == "" {
      lv_m = parse_regex(msg, r'^\s*(?:(?:[\[(]?\d\S*|\[[^\]]*\])\s+){0,4}?(?:[\[<(]\s*(?i:(?P<b>FATAL|PANIC|CRITICAL|CRIT|EMERGENCY|EMERG|ALERT|ERROR|ERR|WARNING|WARN|INFO|NOTICE|DEBUG|TRACE))\s*[\]>)]|(?P<u>FATAL|PANIC|CRITICAL|CRIT|EMERGENCY|EMERG|ALERT|ERROR|ERR|WARNING|WARN|INFO|NOTICE|DEBUG|TRACE)(?:[\s:|\]]|$)|(?i:(?P<c>FATAL|PANIC|ERROR|ERR|WARNING|WARN|INFO|DEBUG|TRACE)):)') ?? {}
      lv_tok = (string(lv_m.b) ?? "") + (string(lv_m.u) ?? "") + (string(lv_m.c) ?? "")
      if lv_tok == "" {
        lv_m = parse_regex(msg, r'^(?P<k>[IWEF])\d{4}\s+\d{2}:\d{2}:\d{2}') ?? {}
        lv_k = string(lv_m.k) ?? ""
        lv_tok = if lv_k == "I" { "INFO" } else if lv_k == "W" { "WARN" } else if lv_k == "E" { "ERROR" } else if lv_k == "F" { "FATAL" } else { "" }
      }
      if lv_tok == "" && match(msg, r'^\s*[\w.\-]+=') {
        lv_m = parse_regex(msg, r'(?:^|\s)(?:log\.)?(?i:level|lvl|severity|loglevel)="?(?i:(?P<l>FATAL|PANIC|CRITICAL|CRIT|EMERGENCY|EMERG|ALERT|ERROR|ERR|WARNING|WARN|INFO|NOTICE|DEBUG|TRACE))\b') ?? {}
        lv_tok = string(lv_m.l) ?? ""
      }
      if lv_tok == "" {
        lv_m = parse_regex(truncate(msg, 120), r'\b(?P<u>FATAL|PANIC|ERROR|WARNING|WARN)\b|[\[<]\s*(?i:(?P<b>FATAL|PANIC|CRITICAL|CRIT|EMERGENCY|EMERG|ALERT|ERROR|ERR|WARNING|WARN))\s*[\]>]|\t(?i:(?P<z>FATAL|PANIC|ERROR|WARNING|WARN|INFO|DEBUG|TRACE))\t|:\s(?i:(?P<c>FATAL|PANIC|ERROR|ERR|WARNING|WARN)):\s|^(?P<x>Exception in thread |Traceback \(most recent call last\))') ?? {}
        lv_tok = (string(lv_m.u) ?? "") + (string(lv_m.b) ?? "") + (string(lv_m.z) ?? "") + (string(lv_m.c) ?? "")
        if lv_tok == "" && (string(lv_m.x) ?? "") != "" { lv_tok = "ERROR" }
      }
      lv_tok = upcase(lv_tok)
      level = string(get(lv_syn, [lv_tok]) ?? null) ?? lv_tok
    }
    if level == "" { level = "INFO" }
    .level = level
    # END purl-level-detection

    if is_object(parsed) {
      .trace_id = string(parsed.trace_id) ?? string(parsed.traceId) ?? ""
      .request_id = string(parsed.request_id) ?? string(parsed.requestId) ?? ""
    }

    del(.kubernetes); del(.file); del(.stream)
    '''

    {{- if .Values.vector.journald.enabled }}

    [transforms.journald_parsed]
    type = "remap"
    inputs = ["journald"]
    source = '''
    .service = to_string(.SYSLOG_IDENTIFIER) ?? "unknown"
    .host = to_string(.host) ?? get_env_var("VECTOR_SELF_NODE_NAME") ?? "unknown"
    .raw = .message
    .timestamp = now()

    cluster_str = get_env_var("CLUSTER_NAME") ?? "default"
    node_str = .host
    .meta = {
      "node": node_str,
      "cluster": cluster_str,
      "source": "journald",
      "unit": to_string(.SYSLOG_IDENTIFIER) ?? ""
    }

    priority = to_int(.PRIORITY) ?? 6
    if priority <= 2 {
      .level = "FATAL"
    } else if priority == 3 {
      .level = "ERROR"
    } else if priority == 4 {
      .level = "WARN"
    } else if priority <= 6 {
      .level = "INFO"
    } else {
      .level = "DEBUG"
    }

    .trace_id = ""
    .request_id = ""
    .span_id = ""
    .parent_span_id = ""
    '''
    {{- end }}

    [transforms.filtered]
    type = "filter"
    inputs = {{ ternary (list "parsed" "journald_parsed") (list "parsed") .Values.vector.journald.enabled | toJson }}
    condition = 'length(string!(.message)) > 0 && !contains(string!(.message), "/health")'

    [sinks.purl]
    type = "http"
    inputs = ["filtered"]
    uri = "http://{{ include "purl.fullname" . }}:{{ .Values.service.port }}/api/logs"
    method = "post"
    compression = "gzip"

    [sinks.purl.encoding]
    codec = "json"

    [sinks.purl.batch]
    max_events = 100
    timeout_secs = 5

    [sinks.purl.buffer]
    type = "disk"
    # int64: Helm parses YAML numbers as float64, so a bare interpolation
    # renders 1.34217728e+08 and Vector (NonZeroU64) refuses to start.
    # The floor is Vector's own, enforced at render time so a bad value is a
    # failed `helm template` rather than a DaemonSet crash-looping on every node.
    {{- if lt (int64 .Values.vector.buffer.maxSizeBytes) 268435488 }}
    {{- fail "vector.buffer.maxSizeBytes must be >= 268435488 (Vector's minimum disk buffer size)" }}
    {{- end }}
    max_size = {{ int64 .Values.vector.buffer.maxSizeBytes }}
    # "block" made Vector stop reading node logs whenever Purl or ClickHouse
    # was unavailable. Because the buffer lives on a hostPath, a blocked
    # Vector holds file handles on /var/log and stops draining, which turned
    # a ClickHouse outage into node-wide disk pressure.
    # "drop_newest" keeps the collector healthy and sheds load instead.
    when_full = "{{ .Values.vector.buffer.whenFull }}"

    [sinks.purl.request]
    # Bounded concurrency + retry backoff: without these Vector retried a
    # dead sink as fast as it could, which is how it accumulated 3600+
    # restarts against an unreachable ClickHouse.
    rate_limit_num = {{ .Values.vector.sink.rateLimitNum }}
    rate_limit_duration_secs = {{ .Values.vector.sink.rateLimitDurationSecs }}
    retry_attempts = {{ .Values.vector.sink.retryAttempts }}
    retry_max_duration_secs = {{ .Values.vector.sink.retryMaxDurationSecs }}
    headers.X-API-Key = "${PURL_API_KEY}"
    headers.Content-Type = "application/json"

    [sources.internal_metrics]
    type = "internal_metrics"

    [sinks.prometheus]
    type = "prometheus_exporter"
    inputs = ["internal_metrics"]
    address = "0.0.0.0:9598"
{{- end }}
