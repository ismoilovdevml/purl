{{- if .Values.vector.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "purl.fullname" . }}-vector
  labels:
    {{- include "purl.labels" . | nindent 4 }}
    app.kubernetes.io/component: vector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "purl.name" . }}-vector
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/vector-configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: {{ include "purl.name" . }}-vector
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: vector
    spec:
      serviceAccountName: {{ include "purl.fullname" . }}-vector
      # NOTE: a blanket `- operator: Exists` used to live here. It tolerated
      # every taint in the cluster, including NoExecute and operator-specific
      # ones, so Vector chased nodes that were deliberately cordoned off.
      # The default below only tolerates control-plane taints.
      # It is NOT possible to keep a DaemonSet off a disk-pressure node via
      # tolerations: the DaemonSet controller unconditionally injects
      # node.kubernetes.io/disk-pressure:NoSchedule into every pod it creates.
      # Vector's disk footprint is bounded by vector.buffer.maxSizeBytes below
      # instead.
      tolerations:
        {{- toYaml .Values.vector.tolerations | nindent 8 }}
      containers:
        - name: vector
          image: "{{ .Values.vector.image.repository }}:{{ .Values.vector.image.tag }}"
          imagePullPolicy: {{ .Values.vector.image.pullPolicy }}
          args: ["--config-dir", "/etc/vector"]
          {{- with .Values.vector.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: PURL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "purl.secretName" . }}
                  key: PURL_API_KEYS
            - name: CLUSTER_NAME
              value: {{ .Values.vector.clusterName | quote }}
          ports:
            - name: api
              containerPort: 8686
              protocol: TCP
            - name: metrics
              containerPort: 9598
              protocol: TCP
          {{- /*
            Probes hit Vector's own API (enabled in vector.toml). Without
            them a wedged Vector — deadlocked disk buffer, stuck sink — stays
            Running indefinitely and the node's logs are lost in silence.
          */}}
          {{- if .Values.vector.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: {{ .Values.vector.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.vector.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.vector.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.vector.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.vector.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: {{ .Values.vector.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.vector.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.vector.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.vector.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.vector.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/vector
              readOnly: true
            - name: data
              mountPath: /var/lib/vector
            - name: var-log
              mountPath: /var/log
              readOnly: true
            - name: pods-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: journal
              mountPath: /var/log/journal
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "purl.fullname" . }}-vector
        - name: data
          hostPath:
            # Namespaced per release: two Purl releases on one cluster used to
            # share /var/lib/vector and fought over buffer.lock, crash-looping
            # both DaemonSets ("failed to lock buffer.lock").
            path: /var/lib/vector/{{ .Release.Namespace }}-{{ .Release.Name }}
            type: DirectoryOrCreate
        - name: var-log
          hostPath:
            path: /var/log
        - name: pods-logs
          hostPath:
            path: /var/log/pods
        - name: journal
          hostPath:
            path: /var/log/journal
            type: DirectoryOrCreate
{{- end }}
