# -- Number of Purl replicas
replicaCount: 1

image:
  # -- Purl container image repository
  repository: ismoilovdev/purl
  # -- Image tag (defaults to Chart appVersion)
  tag: ""
  # -- Image pull policy
  pullPolicy: IfNotPresent

# -- Image pull secrets for private registries
imagePullSecrets: []
# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

serviceAccount:
  # -- Create a service account
  create: true
  # -- Annotations for the service account
  annotations: {}
  # -- Service account name (auto-generated if empty)
  name: ""

# -- Pod-level annotations
podAnnotations: {}

# -- Pod-level security context
podSecurityContext:
  fsGroup: 1000

# -- Container-level security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  readOnlyRootFilesystem: false

service:
  # -- Kubernetes service type (ClusterIP, NodePort, LoadBalancer)
  type: ClusterIP
  # -- Service port
  port: 3000
  # -- Fixed node port (only used when type=NodePort; empty = auto-assign)
  nodePort: ""

ingress:
  # -- Enable ingress
  enabled: false
  # -- Ingress class name (e.g. nginx, traefik)
  className: nginx
  # -- Ingress annotations
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  # -- Ingress hosts
  hosts:
    - host: purl.example.com
      paths:
        - path: /
          pathType: Prefix
  # -- TLS configuration
  tls: []
  #  - secretName: purl-tls
  #    hosts:
  #      - purl.example.com

# -- Purl application configuration
purl:
  # -- Server listen port (inside container)
  port: 3000
  # -- Storage backend type
  storageType: clickhouse
  # -- Comma-separated API keys for log ingest authentication
  apiKeys: ""
  # -- Enable API key authentication for ingest
  authEnabled: true
  # -- Log retention in days
  retentionDays: 30
  # -- Session secret for signed cookies (empty = auto-generate, NOT safe for multi-replica)
  sessionSecret: ""

  # -- Telegram alerting
  telegram:
    # -- Telegram bot token
    botToken: ""
    # -- Telegram chat ID for alerts
    chatId: ""

  # -- Slack alerting
  slack:
    # -- Slack incoming webhook URL
    webhookUrl: ""
    # -- Slack channel override
    channel: ""

  # -- License (Pro/Enterprise). Without a key Purl runs the free plan / 14-day trial.
  license:
    # -- License key JWT (RS256) issued by purlogs.com. Stored in the Secret.
    key: ""
    # -- Public key PEM for offline verification. Empty = online activation against apiUrl.
    publicKey: ""
    # -- License API URL used for online activation/heartbeat
    apiUrl: ""

  # -- Redis for cross-replica WebSocket live tail broadcast
  redis:
    # -- Enable Redis Pub/Sub for multi-replica WebSocket support
    enabled: false
    # -- External Redis URL (e.g., redis://redis:6379)
    url: ""

  # -- Generic webhook alerting
  alertWebhook:
    # -- Webhook URL for alerts
    url: ""
    # -- Bearer token for webhook auth
    token: ""

# -- ClickHouse configuration
clickhouse:
  # -- Deploy ClickHouse as part of this chart.
  # Set to false if using an external ClickHouse instance.
  enabled: true

  image:
    # -- ClickHouse image repository
    repository: clickhouse/clickhouse-server
    # -- ClickHouse image tag
    tag: "25.11-alpine"
    # -- ClickHouse image pull policy
    pullPolicy: IfNotPresent

  # -- External ClickHouse host (used when clickhouse.enabled=false)
  host: ""
  # -- ClickHouse HTTP port
  port: 8123
  # -- ClickHouse database name
  database: purl
  # -- ClickHouse user for Purl
  user: purl
  # -- ClickHouse password for the Purl user.
  # WARNING: if left empty, the app user is created with NO password — any
  # pod in the cluster can then read/write the log database. On shared
  # clusters always set a password AND enable networkPolicy.enabled=true.
  password: ""

  # -- ClickHouse cluster / replication settings
  # All cluster features are DISABLED by default for backward compatibility.
  # Enable for HA deployments with automatic data replication.
  cluster:
    # -- Enable ClickHouse cluster mode (multi-replica with ClickHouse Keeper)
    enabled: false
    # -- Cluster name used in remote_servers config and ReplicatedMergeTree paths
    name: "purl_cluster"
    # -- Number of ClickHouse replicas in the cluster
    replicas: 3
    # -- ClickHouse Keeper settings (embedded consensus for replication)
    keeper:
      # -- Enable embedded ClickHouse Keeper (required for replication)
      enabled: true
      # -- Keeper Raft consensus port
      port: 9181
    # -- Replication settings
    replication:
      # -- Replication factor (informational; all replicas participate in the single shard)
      factor: 2

  # -- Persistence settings for ClickHouse data
  persistence:
    # -- Enable persistent storage
    enabled: true
    # -- PVC size
    size: 10Gi
    # -- Storage class (empty = cluster default)
    storageClass: ""
    # -- Access modes
    accessModes:
      - ReadWriteOnce

  # -- ClickHouse resource limits and requests
  # -- ClickHouse resources. ephemeral-storage covers /var/log/clickhouse-server
  # (an emptyDir, see logsSizeLimit) and the container writable layer. It does
  # NOT cover the data PVC.
  resources:
    limits:
      memory: 4Gi
      cpu: "2"
      ephemeral-storage: 2Gi
    requests:
      memory: 1Gi
      cpu: "500m"
      ephemeral-storage: 512Mi
  # -- Cap on the /var/log/clickhouse-server emptyDir. Unbounded, ClickHouse
  # server+error logs grow onto the node filesystem with nothing to stop them.
  logsSizeLimit: 1Gi

# -- Autoscaling (HPA) for Purl pods
autoscaling:
  # -- Enable HorizontalPodAutoscaler
  enabled: false
  # -- Minimum number of replicas
  minReplicas: 1
  # -- Maximum number of replicas
  maxReplicas: 10
  # -- Target CPU utilization percentage
  targetCPUUtilizationPercentage: 70
  # -- Target memory utilization percentage
  targetMemoryUtilizationPercentage: 80

# -- PodDisruptionBudget for Purl and ClickHouse
podDisruptionBudget:
  # -- Enable PodDisruptionBudget
  enabled: false
  # -- Minimum number of pods that must be available
  minAvailable: 1

# -- NetworkPolicy for zero-trust pod networking
networkPolicy:
  # -- Enable NetworkPolicy resources
  enabled: false

# -- Vector log collector (DaemonSet) for Kubernetes pod log collection
vector:
  # -- Deploy Vector as part of this chart. ON by default: Purl is a log
  # aggregator, so a fresh k8s install should collect pod logs out of the box
  # (the DaemonSet ships them to /api/logs with the ingest API key). Set false
  # to run Purl as an ingest-only endpoint with an external collector.
  enabled: true
  image:
    # -- Vector image repository
    repository: timberio/vector
    # -- Vector image tag
    tag: "0.51.1-alpine"
    # -- Vector image pull policy
    pullPolicy: IfNotPresent
  # -- Vector resource limits and requests.
  # ephemeral-storage is required: without a request the scheduler treats
  # Vector as using zero disk and the kubelet ranks it first for eviction
  # under disk pressure, which is exactly the wrong pod to kill.
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
      ephemeral-storage: 1Gi
    requests:
      cpu: 50m
      memory: 64Mi
      ephemeral-storage: 256Mi
  # -- Taints Vector tolerates. Deliberately NOT `- operator: Exists`, which
  # tolerates every taint in the cluster including NoExecute.
  # The DaemonSet controller always injects a disk-pressure toleration on top
  # of this list; that cannot be disabled, so Vector's disk usage is capped by
  # buffer.maxSizeBytes instead of by scheduling rules.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
  # -- Vector on-disk sink buffer (lives on the node via hostPath)
  buffer:
    # -- Max buffer size in bytes per node. Vector enforces a HARD MINIMUM of
    # 268435488 bytes for a disk buffer and refuses to start below it
    # ("parameter 'max_buffer_size' was invalid: must be greater than or equal
    # to 268435488 bytes"). Do not lower this; the template fails fast if you do.
    maxSizeBytes: 268435488
    # -- Behaviour when the buffer fills: drop_newest sheds load,
    # block stalls the whole collector and stops it reading node logs.
    whenFull: drop_newest
  # -- Sink rate limiting and retry bounds
  sink:
    # -- Max requests per rateLimitDurationSecs window
    rateLimitNum: 100
    # -- Rate limit window in seconds
    rateLimitDurationSecs: 1
    # -- Retry attempts before dropping a batch
    retryAttempts: 5
    # -- Give up retrying a batch after this many seconds
    retryMaxDurationSecs: 300
  # -- Kubernetes cluster name for log metadata
  clusterName: "default"
  # -- Collect logs from kube-system namespace (control plane components)
  collectKubeSystem: false

# -- Purl container resource limits and requests
resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# -- Config volume for settings.json, users, license files
config:
  volume:
    # -- Mount a PVC at /app/config.
    # ON by default: /app/config holds the dashboard user database, the
    # license key and settings.json. With an emptyDir every restart, rollout
    # or eviction silently wipes all dashboard logins and the license, so a
    # default install was not persistent in any meaningful sense.
    enabled: true
    # -- PVC size for config data
    size: 1Gi
    # -- Storage class (empty = cluster default)
    storageClass: ""

# -- Prometheus monitoring
metrics:
  serviceMonitor:
    # -- Enable ServiceMonitor for Prometheus Operator
    enabled: false
    # -- Scrape interval
    interval: 30s
    # -- Scrape timeout
    scrapeTimeout: 10s
    # -- Additional labels for ServiceMonitor (e.g., release: prometheus)
    labels: {}
  prometheusRule:
    # -- Enable PrometheusRule for alerting
    enabled: false
    # -- Additional labels for PrometheusRule
    labels: {}
    # -- Alert if no logs were ingested in this window. Set to "" to disable
    # (appropriate for an install with genuinely bursty, low-volume ingest).
    ingestStalledFor: 30m
    # -- Capacity the ClickHouse data volume is expected to hold, in bytes.
    # PurlDiskFillPredicted fires when purl_db_size_bytes is trending to cross
    # this within diskFillPredictWindow. Default 10 GiB matches
    # clickhouse.persistence.size.
    dbSizeLimitBytes: 10737418240
    # -- Lookahead for the disk-fill prediction, in seconds (86400 = 24h)
    diskFillPredictSeconds: 86400

# -- Node selector constraints
nodeSelector: {}

# -- Tolerations for pod scheduling
tolerations: []

# -- Affinity rules for pod scheduling
affinity: {}

# -- Scheduled ClickHouse backups (native BACKUP -> S3).
# Runs a CronJob that issues `BACKUP DATABASE <db> TO S3(...)` server-side.
# Backups stream directly from ClickHouse to S3 — nothing is materialised in the
# job pod. Restore is a manual/DR operation via deploy/backup/restore.sh.
backup:
  # -- Enable the scheduled backup CronJob.
  enabled: false
  # -- Cron schedule (default: 02:00 UTC daily).
  schedule: "0 2 * * *"

  image:
    # -- Image with clickhouse-client (used to issue BACKUP SQL).
    repository: clickhouse/clickhouse-server
    # -- Image tag (keep aligned with the ClickHouse server version).
    tag: "25.11-alpine"
    # -- Image pull policy.
    pullPolicy: IfNotPresent

  s3:
    # -- Target S3 bucket (required when backup.enabled=true).
    bucket: ""
    # -- S3 region (used to build the AWS virtual-hosted URL).
    region: us-east-1
    # -- Key prefix inside the bucket.
    prefix: "purl-backups/"
    # -- Custom S3 endpoint (e.g. MinIO: http://minio:9000). Empty = AWS.
    endpoint: ""
    # -- Name of an EXISTING secret holding AWS_ACCESS_KEY_ID and
    # AWS_SECRET_ACCESS_KEY. Required when backup.enabled=true — credentials are
    # NEVER templated into the chart. Create it out-of-band, e.g.:
    #   kubectl create secret generic purl-backup-s3 \
    #     --from-literal=AWS_ACCESS_KEY_ID=... \
    #     --from-literal=AWS_SECRET_ACCESS_KEY=...
    existingSecret: ""

  # -- Retention (days). ClickHouse native BACKUP does not delete old backups;
  # enforce this with an S3 bucket lifecycle rule scoped to s3.prefix. Advisory
  # here (surfaced as an env var / log line), not enforced by the CronJob.
  retentionDays: 30

  # -- Keep this many successful / failed Job records.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # -- Do not start a new backup while the previous one is still running.
  concurrencyPolicy: Forbid
  # -- Job restart policy and retry budget.
  restartPolicy: OnFailure
  backoffLimit: 2
  # -- Hard time limit for a single backup run (seconds).
  activeDeadlineSeconds: 3600

  # -- Resource requests/limits for the backup pod.
  resources: {}
  # -- Pod-level security context for the backup pod.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
  # -- Container-level security context for the backup pod.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  # -- Scheduling controls for the backup pod.
  nodeSelector: {}
  tolerations: []
  affinity: {}
