apiVersion: apps/v1
kind: Deployment
metadata:
  name: purl
  namespace: purl
  labels:
    app.kubernetes.io/name: purl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: purl
  template:
    metadata:
      labels:
        app: purl
    spec:
      # The prefork manager drains gracefully on SIGQUIT but hard-kills
      # workers on SIGTERM. Kubernetes always sends SIGTERM on pod
      # termination (it does NOT honour the image STOPSIGNAL), so a preStop
      # hook converts the shutdown into a graceful SIGQUIT to PID 1 first.
      # Allow enough grace time for in-flight requests to finish before
      # Kubernetes follows up with SIGTERM/SIGKILL.
      terminationGracePeriodSeconds: 60
      containers:
        - name: purl
          image: ismoilovdev/purl:latest
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "kill -QUIT 1"]
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: purl-config
            - secretRef:
                name: purl-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: purl
  namespace: purl
  labels:
    app.kubernetes.io/name: purl
spec:
  selector:
    app: purl
  ports:
    - name: http
      port: 80
      targetPort: 3000
  type: ClusterIP
