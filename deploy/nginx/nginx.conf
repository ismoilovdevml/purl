# Purl — Nginx TLS Reverse Proxy
# Rate limiting zone: 10 requests/second per client IP
limit_req_zone $binary_remote_addr zone=purl_limit:10m rate=10r/s;

# Upstream backend
upstream purl_backend {
    server purl:3000;
    keepalive 32;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME challenge support (optional, for Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # -------------------------------------------
    # SSL Configuration
    # -------------------------------------------
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Protocols: TLSv1.2 and TLSv1.3 only
    ssl_protocols TLSv1.2 TLSv1.3;

    # Modern cipher suite (TLSv1.3 ciphers managed automatically)
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL session caching
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # -------------------------------------------
    # Security Headers
    # -------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # -------------------------------------------
    # Gzip Compression
    # -------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # -------------------------------------------
    # Client Settings
    # -------------------------------------------
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # -------------------------------------------
    # Proxy Settings (common)
    # -------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;

    # -------------------------------------------
    # WebSocket support for /ws paths
    # -------------------------------------------
    location /ws {
        proxy_pass http://purl_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # -------------------------------------------
    # API endpoints with rate limiting
    # -------------------------------------------
    location /api/ {
        limit_req zone=purl_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://purl_backend;
    }

    # -------------------------------------------
    # All other requests
    # -------------------------------------------
    location / {
        proxy_pass http://purl_backend;
    }

    # -------------------------------------------
    # Health check (bypass rate limiting)
    # -------------------------------------------
    location = /api/health {
        proxy_pass http://purl_backend;
    }
}
