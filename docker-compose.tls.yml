# Docker Compose TLS Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# Prerequisites:
#   - Place SSL certificate at deploy/nginx/ssl/cert.pem
#   - Place SSL private key at deploy/nginx/ssl/key.pem

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: purl-nginx
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      purl:
        condition: service_healthy
    networks:
      - purl-network

  purl:
    ports: []  # Remove direct port exposure
