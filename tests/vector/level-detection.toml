# Level-detection cases for every Vector config Purl ships (#111).
# tests/vector/run.sh substitutes @TRANSFORM@ with the remap transform under
# test and runs `vector test` against the chart, deploy/vector/vector.toml
# and the agent config install.sh writes.

[[tests]]
name = "free text mentioning debug is not DEBUG"

[[tests.inputs]]
insert_at = "@TRANSFORM@"
type = "log"

[tests.inputs.log_fields]
message = "user clicked debug panel"
container_name = "/app"

[[tests.outputs]]
extract_from = "@TRANSFORM@"

[[tests.outputs.conditions]]
type = "vrl"
source = 'assert_eq!(.level, "INFO")'

[[tests]]
name = "structured JSON level wins"

[[tests.inputs]]
insert_at = "@TRANSFORM@"
